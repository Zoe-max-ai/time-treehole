function switchWishTab(tab){currentWishTab=tab;const wishBtn=document.getElementById('wishTabBtn');const boardBtn=document.getElementById('boardTabBtn');const wishContent=document.getElementById('wishTabContent');const boardContent=document.getElementById('boardTabContent');if(tab==='wish'){wishBtn.style.color='var(--primary)';wishBtn.style.borderBottom='2px solid var(--primary)';boardBtn.style.color='#999';boardBtn.style.borderBottom='2px solid transparent';wishContent.style.display='block';boardContent.style.display='none';renderWishPage();}else{boardBtn.style.color='var(--primary)';boardBtn.style.borderBottom='2px solid var(--primary)';wishBtn.style.color='#999';wishBtn.style.borderBottom='2px solid transparent';boardContent.style.display='block';wishContent.style.display='none';renderBoardPage();}}
function renderWishPage(){const wishes=JSON.parse(localStorage.getItem('wishes')||'[]');let html='<div style="padding:16px;display:flex;flex-direction:column;align-items:center;"><div style="width:100%;max-width:400px;margin-bottom:20px;display:flex;gap:8px;"><input type="text" id="wishInput" placeholder="写下你的愿望..." style="flex:1;padding:12px 16px;border-radius:12px;border:1.5px solid #e8e0d8;background:#fff;font-size:14px;outline:none;color:#333;"><button onclick="addWish()" style="padding:12px 20px;border-radius:12px;background:#f5f0eb;border:1.5px solid #e8e0d8;color:#666;font-size:14px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background=\'#e8e0d8\'" onmouseout="this.style.background=\'#f5f0eb\'">📝</button></div><div id="wishList" style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;">';if(wishes.length===0){html+='<p style="color:#ccc;text-align:center;padding:40px;font-size:14px;">✨ 还没有愿望，写一个吧</p>';}else{wishes.forEach((w,i)=>{html+='<div style="background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #f0ece8;box-shadow:0 1px 4px rgba(0,0,0,0.02);position:relative;"><div style="display:flex;align-items:flex-start;gap:10px;"><span onclick="toggleWish('+i+')" style="cursor:pointer;font-size:18px;margin-top:1px;flex-shrink:0;">'+(w.done?'✅':'○')+'</span><div style="flex:1;"><div style="font-size:15px;color:'+(w.done?'#ccc':'#333')+';text-decoration:'+(w.done?'line-through':'none')+';word-break:break-word;">'+w.content+'</div><div style="font-size:10px;color:#ccc;margin-top:4px;">'+w.time+'</div></div><span onclick="deleteWish('+i+')" style="cursor:pointer;color:#d4a8b8;font-size:14px;padding:2px 4px;flex-shrink:0;">✕</span></div></div>';});}html+='</div></div>';document.getElementById('wishTabContent').innerHTML=html;}
function addWish(){const input=document.getElementById('wishInput');const content=input.value.trim();if(!content)return;const wishes=JSON.parse(localStorage.getItem('wishes')||'[]');wishes.push({content,done:false,time:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})});localStorage.setItem('wishes',JSON.stringify(wishes));input.value='';renderWishPage();}
function toggleWish(index){const wishes=JSON.parse(localStorage.getItem('wishes')||'[]');wishes[index].done=!wishes[index].done;localStorage.setItem('wishes',JSON.stringify(wishes));renderWishPage();}
function deleteWish(index){const wishes=JSON.parse(localStorage.getItem('wishes')||'[]');wishes.splice(index,1);localStorage.setItem('wishes',JSON.stringify(wishes));renderWishPage();}
async function renderBoardPage(){const messages=JSON.parse(localStorage.getItem('boardMessages')||'[]');await checkBoardAutoReply();const updated=JSON.parse(localStorage.getItem('boardMessages')||'[]');let html='<div style="padding:16px;display:flex;flex-direction:column;align-items:center;"><div style="width:100%;max-width:400px;margin-bottom:16px;"><div style="font-size:12px;color:#aaa;text-align:center;margin-bottom:12px;">💬 秦彻会随机在 6~24 小时内回复你</div><div style="display:flex;gap:8px;"><input type="text" id="boardInput" placeholder="写一条留言..." style="flex:1;padding:12px 16px;border-radius:12px;border:1.5px solid #e8e0d8;background:#fff;font-size:14px;outline:none;color:#333;"><button onclick="addBoardMessage()" style="padding:12px 20px;border-radius:12px;background:#f5f0eb;border:1.5px solid #e8e0d8;color:#666;font-size:14px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background=\'#e8e0d8\'" onmouseout="this.style.background=\'#f5f0eb\'">留言</button></div></div><div id="boardList" style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;">';if(updated.length===0){html+='<p style="color:#ccc;text-align:center;padding:40px;font-size:14px;">💬 还没有留言，写一条吧～</p>';}else{updated.slice().reverse().forEach(item=>{const isUser=item.sender==='user';const name=isUser?S.myName:S.contactName;const avatar=isUser?getAvatar('me'):getAvatar('contact');const isReplied=item.replied||false;html+='<div style="background:#fff;border-radius:4px 16px 16px 16px;padding:16px 18px;border:1px solid #f0e8e0;box-shadow:0 2px 6px rgba(0,0,0,0.02);position:relative;"><div style="position:absolute;top:-6px;left:12px;font-size:14px;color:#ccc;">📌</div><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;padding-top:4px;"><img src="'+avatar+'" style="width:22px;height:22px;border-radius:50%;object-fit:cover;"><span style="font-size:14px;font-weight:500;color:#333;">'+name+'</span><span style="font-size:10px;color:#ccc;margin-left:auto;">'+item.time+'</span></div><div style="font-size:14px;color:#444;margin-bottom:6px;word-break:break-word;padding-left:4px;">'+item.content+'</div>'+(item.replyTo?'<div style="font-size:11px;color:#bbb;background:#f8f5f2;padding:4px 10px;border-radius:8px;margin-bottom:6px;">↳ 回复：'+item.replyTo+'</div>':'')+'<div style="display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:2px;">'+(!isUser&&!isReplied?'<span style="font-size:10px;color:#d4a8b8;">⏳ 待回复</span>':'')+(isUser&&!isReplied?'<span style="font-size:10px;color:#aaa;">等待秦彻回复...</span>':'')+(isUser&&isReplied?'<span style="font-size:10px;color:#ccc;">已回复</span>':'')+(!isUser&&isReplied?'<span style="font-size:10px;color:#ccc;">已结束</span>':'')+(!isReplied?'<button onclick="replyBoardMessage('+item.id+')" style="padding:4px 14px;border-radius:14px;border:1px solid #d4a8b8;background:transparent;color:#d4a8b8;font-size:11px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background=\'#d4a8b8\';this.style.color=\'#fff\'" onmouseout="this.style.background=\'transparent\';this.style.color=\'#d4a8b8\'">回复</button>':'')+'</div></div>';});}html+='</div></div>';document.getElementById('boardTabContent').innerHTML=html;}
function addBoardMessage(){const input=document.getElementById('boardInput');const content=input.value.trim();if(!content)return;const messages=JSON.parse(localStorage.getItem('boardMessages')||'[]');const id=Date.now()+Math.random()*1000;messages.push({id:id,sender:'user',content:content,time:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),replied:false,replyTo:null,timestamp:Date.now()});localStorage.setItem('boardMessages',JSON.stringify(messages));localStorage.setItem('boardLastTriggerTime',String(Date.now()));input.value='';renderBoardPage();}
function replyBoardMessage(id){const messages=JSON.parse(localStorage.getItem('boardMessages')||'[]');const item=messages.find(m=>m.id===id);if(!item)return;const replyContent=prompt('输入你的回复：');if(!replyContent||replyContent.trim()==='')return;const newId=Date.now()+Math.random()*1000;messages.push({id:newId,sender:'user',content:replyContent.trim(),time:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),replied:false,replyTo:item.content,timestamp:Date.now()});localStorage.setItem('boardMessages',JSON.stringify(messages));localStorage.setItem('boardLastTriggerTime',String(Date.now()));renderBoardPage();}
async function checkBoardAutoReply(){const messages=JSON.parse(localStorage.getItem('boardMessages')||'[]');const lastTrigger=parseInt(localStorage.getItem('boardLastTriggerTime')||'0');const delay=parseInt(localStorage.getItem('boardReplyDelay')||'12');const now=Date.now();const unReplied=messages.filter(m=>m.sender==='user'&&!m.replied);if(unReplied.length===0)return;if(lastTrigger===0||(now-lastTrigger)<delay*3600*1000)return;const groupName=localStorage.getItem('mailboxGroups')?JSON.parse(localStorage.getItem('mailboxGroups'))[0]:null;let replyContent='😅 还没有设置留言板分组哦～';if(groupName){const allCards=await dbGetAll('wordcards');const cards=allCards.filter(c=>(c.groupName===groupName||c.groupId===groupName)&&c.content&&c.content!=='__GROUP_PLACEHOLDER__'&&c.content.length>1);if(cards.length>0){const count=Math.min(Math.floor(Math.random()*5)+2,cards.length);const shuffled=cards.sort(()=>Math.random()-0.5);const selected=shuffled.slice(0,count);replyContent=selected.map(c=>c.content).join(' ');}}messages.forEach(m=>{if(m.sender==='user'&&!m.replied){m.replied=true;}});const id=Date.now()+Math.random()*1000;messages.push({id:id,sender:'qin',content:replyContent,time:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),replied:true,replyTo:'用户留言',timestamp:Date.now()});localStorage.setItem('boardMessages',JSON.stringify(messages));localStorage.setItem('boardLastTriggerTime',String(now));}

function openAnniversaryPage(){showPage('anniversaryPage');renderAnniversaryPage();}
function renderAnniversaryPage(){const anniversaries=JSON.parse(localStorage.getItem('anniversaries')||'[]');const now=new Date();const currentYear=localStorage.getItem('calendarYear')?parseInt(localStorage.getItem('calendarYear')):now.getFullYear();const currentMonth=localStorage.getItem('calendarMonth')?parseInt(localStorage.getItem('calendarMonth')):now.getMonth();let html='<div style="padding:16px;display:flex;flex-direction:column;align-items:center;background:#f8f5f0;min-height:100vh;"><div style="width:100%;max-width:400px;"><div style="margin-bottom:20px;display:flex;gap:8px;flex-wrap:wrap;background:#fff;padding:16px;border-radius:16px;border:1px solid #f0ece8;"><input type="date" id="anniversaryDate" placeholder="点击选择日期" onclick="if(this.value===\'\'&&this.showPicker)this.showPicker()" style="flex:1;padding:12px 16px;border-radius:12px;border:1.5px solid #e8e0d8;background:#fff;font-size:14px;outline:none;min-width:150px;color:#333;"><input type="text" id="anniversaryName" placeholder="纪念日名称..." style="flex:2;padding:12px 16px;border-radius:12px;border:1.5px solid #e8e0d8;background:#fff;font-size:14px;outline:none;min-width:120px;"><button onclick="addAnniversary()" style="padding:12px 20px;border-radius:12px;background:#f5f0eb;border:1.5px solid #e8e0d8;color:#666;font-size:14px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background=\'#e8e0d8\'" onmouseout="this.style.background=\'#f5f0eb\'">添加</button></div><div id="anniversaryList" style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px;">';if(anniversaries.length===0){html+='<p style="color:#ccc;text-align:center;padding:20px;font-size:14px;">📅 还没有纪念日</p>';}else{anniversaries.sort((a,b)=>new Date(b.date)-new Date(a.date));anniversaries.forEach((item,i)=>{const days=Math.floor((Date.now()-new Date(item.date))/(1000*60*60*24));html+='<div style="background:#fff;border-radius:16px;padding:14px 18px;border:1px solid #f0ece8;display:flex;align-items:center;gap:12px;"><span style="font-size:16px;">📅</span><div style="flex:1;"><div style="font-size:14px;color:#333;">'+item.name+'</div><div style="font-size:11px;color:#ccc;">'+item.date+'</div></div><span style="font-size:12px;color:#d4a8b8;font-weight:500;">'+(days>=0?'已过 '+days+' 天':'还有 '+Math.abs(days)+' 天')+'</span><span onclick="deleteAnniversary('+i+')" style="cursor:pointer;color:#d4a8b8;font-size:14px;">✕</span></div>';});}html+='</div><div style="background:#fff;border-radius:16px;padding:20px;border:1px solid #f0ece8;width:100%;max-width:400px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;"><button onclick="changeMonth(-1)" style="padding:4px 12px;border-radius:8px;border:1px solid #e8e0d8;background:transparent;color:#666;cursor:pointer;font-size:14px;">‹</button><span style="font-size:16px;font-weight:500;color:#333;">'+currentYear+'年 '+(currentMonth+1)+'月</span><button onclick="changeMonth(1)" style="padding:4px 12px;border-radius:8px;border:1px solid #e8e0d8;background:transparent;color:#666;cursor:pointer;font-size:14px;">›</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;">'+['一','二','三','四','五','六','日'].map(d=>'<div style="font-size:11px;color:#bbb;padding:4px 0;">'+d+'</div>').join('');const firstDay=new Date(currentYear,currentMonth,1).getDay();const daysInMonth=new Date(currentYear,currentMonth+1,0).getDate();const today=new Date();const todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');const anniversaryDates=new Set();anniversaries.forEach(item=>{const d=new Date(item.date);if(d.getFullYear()===currentYear&&d.getMonth()===currentMonth){anniversaryDates.add(d.getDate());}});const startOffset=firstDay===0?6:firstDay-1;for(let i=0;i<startOffset;i++){html+='<div style="padding:4px 0;"></div>';}for(let d=1;d<=daysInMonth;d++){const dateStr=currentYear+'-'+String(currentMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const isToday=dateStr===todayStr;const hasAnniversary=anniversaryDates.has(d);html+='<div style="padding:4px 0;display:flex;justify-content:center;"><div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;color:'+(isToday?'#d4a8b8':'#333')+';font-weight:'+(isToday?'600':'400')+';'+(hasAnniversary?'border:2px solid #d4a8b8;':'')+'">'+d+'</div></div>';}html+='</div><div style="display:flex;justify-content:center;gap:16px;margin-top:12px;font-size:11px;color:#ccc;"><span>● 有纪念日</span></div></div></div></div>';document.getElementById('anniversaryContent').innerHTML=html;}
function changeMonth(delta){const currentYear=localStorage.getItem('calendarYear')?parseInt(localStorage.getItem('calendarYear')):new Date().getFullYear();const currentMonth=localStorage.getItem('calendarMonth')?parseInt(localStorage.getItem('calendarMonth')):new Date().getMonth();let newMonth=currentMonth+delta;let newYear=currentYear;if(newMonth>11){newMonth=0;newYear++;}if(newMonth<0){newMonth=11;newYear--;}localStorage.setItem('calendarYear',String(newYear));localStorage.setItem('calendarMonth',String(newMonth));renderAnniversaryPage();}

der:1px solid #eee;border-radius:6px;padding:4px;"></div>':'')+'<div class="settings-row"><span>表情混入消息</span><div class="toggle-switch '+(cs.emojiMix?'on':'')+'" onclick="toggleChatSetting(\'emojiMix\',this)"></div></div><div class="settings-row"><span>模拟通话</span><div class="toggle-switch '+(cs.simCall?'on':'')+'" onclick="toggleChatSetting(\'simCall\',this)"></div></div></div><div class="settings-section"><h4>🤖 自动回复</h4><div class="settings-row"><span>最快回复（秒）</span><input type="number" id="setMin" value="'+S.minReplyTime+'" style="width:60px;text-align:center;border:1px solid #eee;border-radius:6px;padding:4px;"></div><div class="settings-row"><span>最慢回复（分钟）</span><input type="number" id="setMax" value="'+S.maxReplyTime+'" style="width:60px;text-align:center;border:1px solid #eee;border-radius:6px;padding:4px;"></div><div class="settings-row"><span>回复次数</span><input type="number" id="setCnt" value="'+S.replyCount+'" style="width:60px;text-align:center;border:1px solid #eee;border-radius:6px;padding:4px;"></div></div><button style="width:100%;padding:12px;border-radius:12px;background:var(--primary);color:#fff;border:none;font-size:15px;cursor:pointer;" onclick="saveAllChatSettings()">💾 保存聊天设置</button><button style="width:100%;padding:10px;margin-top:6px;border-radius:12px;background:#f0f0f0;border:none;cursor:pointer;" onclick="closeChatSettings()">关闭</button>';document.getElementById('chatSettingsOverlay').classList.add('show');}
function closeChatSettings(){document.getElementById('chatSettingsOverlay').classList.remove('show');}
function toggleChatSetting(key,el){S.chatSettings[key]=!S.chatSettings[key];el.classList.toggle('on',S.chatSettings[key]);saveChatSettings();if(key==='autoSend'){restartAutoSend();openChatSettings();}}
function saveTopQuoteFromPanel(){const v=document.getElementById('setTopQuote').value.trim();if(v){S.topQuote=v;document.getElementById('chatTopQuote').textContent=S.topQuote;dbPut('settings',{key:'topQuote',value:S.topQuote});showToast('文案已更新');}}
async function saveChatSettings(){await dbPut('settings',{key:'chatSettings',value:JSON.stringify(S.chatSettings)});}
async function saveAllChatSettings(){S.minReplyTime=document.getElementById('setMin').value;S.maxReplyTime=document.getElementById('setMax').value;S.replyCount=document.getElementById('setCnt').value;const v=document.getElementById('setTopQuote').value.trim();if(v){S.topQuote=v;document.getElementById('chatTopQuote').textContent=S.topQuote;await dbPut('settings',{key:'topQuote',value:S.topQuote});}await dbPut('settings',{key:'minReplyTime',value:S.minReplyTime});await dbPut('settings',{key:'maxReplyTime',value:S.maxReplyTime});await dbPut('settings',{key:'replyCount',value:S.replyCount});await saveChatSettings();closeChatSettings();showToast('✅ 聊天设置已保存');}
function editTopQuote(){const n=prompt('修改顶部文案：',S.topQuote);if(n&&n.trim()){S.topQuote=n.trim();document.getElementById('chatTopQuote').textContent=S.topQuote;dbPut('settings',{key:'topQuote',value:S.topQuote});}}
function startAutoSendIfNeeded(){if(autoSendTimer)clearInterval(autoSendTimer);if(S.chatSettings.autoSend){const i=parseInt(S.chatSettings.autoSendInterval)||10;autoSendTimer=setInterval(async()=>{if(callState!=='idle')return;const c=await smartComposeReply();const m={sender:'other',content:c,type:'text',timestamp:Date.now()};const id=await dbPut('messages',m);m.id=id;renderMsg(m);},i*60000);}}
function restartAutoSend(){startAutoSendIfNeeded();}

// ============ 初始化 ============
async function init(){let storageAvailable=false;try{localStorage.setItem('__test__','1');const testVal=localStorage.getItem('__test__');localStorage.removeItem('__test__');if(testVal==='1'){storageAvailable=true;console.log('✅ localStorage 可用');}}catch(e){console.error('❌ localStorage 异常:',e);}if(!storageAvailable){console.error('❌ localStorage 不可用，尝试降级方案');try{const emojis=JSON.parse(localStorage.getItem('emojis')||'[]');if(emojis.length>10){const recent=emojis.slice(-10);localStorage.setItem('emojis',JSON.stringify(recent));console.log('⚠️ 已清理旧表情包，保留最近10个');}}catch(e){}try{localStorage.setItem('__test2__','1');localStorage.removeItem('__test2__');storageAvailable=true;console.log('✅ 降级后 localStorage 可用');}catch(e){showToast('⚠️ 存储空间不足，建议清理数据');}}const savedSettings=localStorage.getItem('settings');if(savedSettings){try{const allS=JSON.parse(savedSettings);allS.forEach(x=>{if(x.key==='chatSettings'){try{S.chatSettings=JSON.parse(x.value);console.log('✅ 加载 chatSettings:',S.chatSettings);}catch(e){console.error('解析 chatSettings 失败:',e);}}else if(x.key in S){S[x.key]=x.value;}});}catch(e){console.error('加载设置失败:',e);}}else{console.log('⚠️ 没有找到保存的设置');}if(!S.chatSettings||typeof S.chatSettings!=='object'){S.chatSettings={quoteReply:true,readReceipt:'text',readNotReply:false,typing:true,autoSend:false,autoSendInterval:'10',emojiMix:true,simCall:true};}const savedAvatars=localStorage.getItem('avatars');if(savedAvatars){try{const allA=JSON.parse(savedAvatars);allA.forEach(x=>{if(x.key==='myAvatar'){S.myAvatar=x.data;console.log('✅ 已恢复我的头像');}else if(x.key==='contactAvatar'){S.contactAvatar=x.data;console.log('✅ 已恢复秦彻头像');}});}catch(e){console.log('头像数据格式错误，已跳过');}}const savedPat=localStorage.getItem('patOptions');if(savedPat){try{const allP=JSON.parse(savedPat);if(Array.isArray(allP)&&allP.length>0){patOptions=allP.map(x=>x.content||x);console.log('✅ 已恢复拍一拍');}}catch(e){console.log('拍一拍数据格式错误');}}const savedMood=localStorage.getItem('contactMood');if(savedMood){S.contactMood=savedMood;console.log('✅ 已恢复秦彻想说');}const savedMyName=localStorage.getItem('myName');if(savedMyName){S.myName=savedMyName;console.log('✅ 已恢复我的昵称');}const savedContactName=localStorage.getItem('contactName');if(savedContactName){S.contactName=savedContactName;console.log('✅ 已恢复对方昵称');}const savedBg=localStorage.getItem('bgSettings');if(savedBg){try{const allBg=JSON.parse(savedBg);allBg.forEach(x=>{if(x.key==='homeBg')S.homeBg=x.value;else if(x.key==='chatBg')S.chatBg=x.value;else if(x.key==='homeBgImage')S.homeBgImage=x.value;else if(x.key==='chatBgImage')S.chatBgImage=x.value;});console.log('✅ 已恢复背景设置');}catch(e){console.log('背景数据格式错误');}}const savedChatGroups=localStorage.getItem('chatGroups');const savedMailboxGroups=localStorage.getItem('mailboxGroups');const savedTarotGroup=localStorage.getItem('tarotGroup');const savedAnswerBookGroup=localStorage.getItem('answerBookGroup');if(savedChatGroups)console.log('✅ 已恢复聊天分组:',JSON.parse(savedChatGroups));if(savedMailboxGroups)console.log('✅ 已恢复留言板分组:',JSON.parse(savedMailboxGroups));if(savedTarotGroup)console.log('✅ 已恢复塔罗分组:',savedTarotGroup);if(savedAnswerBookGroup)console.log('✅ 已恢复答案之书分组:',savedAnswerBookGroup);const emojis=JSON.parse(localStorage.getItem('emojis')||'[]');if(emojis.length>0){console.log('✅ 已加载',emojis.length,'个表情包');}const homeEl=document.getElementById('homeInner');if(S.homeBg&&S.homeBg!=='default'){if(S.homeBg==='custom'&&S.homeBgImage){if(homeEl){homeEl.style.backgroundImage='url('+S.homeBgImage+')';homeEl.style.backgroundSize='cover';homeEl.style.backgroundPosition='center';}}else{const m2={sunset:'#ffecd2',ocean:'#e0f7fa',lavender:'#f3e5f5'};if(m2[S.homeBg]&&homeEl){homeEl.style.background=m2[S.homeBg];homeEl.style.backgroundImage='none';}}}const chatEl=document.getElementById('chatArea');if(S.chatBg&&S.chatBg!=='default'){if(S.chatBg==='custom'&&S.chatBgImage){if(chatEl){chatEl.style.backgroundImage='url('+S.chatBgImage+')';chatEl.style.backgroundSize='cover';chatEl.style.backgroundPosition='center';}}else{const m={warm:'#fffdf5',cool:'#f5f8ff',pink:'#fff5f7'};if(m[S.chatBg]&&chatEl){chatEl.style.background=m[S.chatBg];chatEl.style.backgroundImage='none';}}}const ball=document.getElementById('callFloatBall');if(ball){const newBall=ball.cloneNode(true);ball.parentNode.replaceChild(newBall,ball);const freshBall=document.getElementById('callFloatBall');freshBall.addEventListener('touchstart',function(e){if(callState!=='active')return;ballDragging=true;ballMoved=false;const t=e.touches[0];ballStartX=t.clientX;ballStartY=t.clientY;const r=freshBall.getBoundingClientRect();ballLeft=r.left;ballTop=r.top;freshBall.style.right='auto';freshBall.style.bottom='auto';freshBall.style.left=ballLeft+'px';freshBall.style.top=ballTop+'px';e.preventDefault();},{passive:false});freshBall.addEventListener('touchmove',function(e){if(!ballDragging)return;ballMoved=true;const t=e.touches[0];let l=ballLeft+(t.clientX-ballStartX);let tp=ballTop+(t.clientY-ballStartY);l=Math.max(4,Math.min(window.innerWidth-58,l));tp=Math.max(60,Math.min(window.innerHeight-160,tp));freshBall.style.left=l+'px';freshBall.style.top=tp+'px';e.preventDefault();},{passive:false});freshBall.addEventListener('touchend',function(){if(!ballDragging)return;ballDragging=false;if(!ballMoved&&callState==='active'){restoreCall();return;}const r=freshBall.getBoundingClientRect();if(r.left+r.width/2<window.innerWidth/2){freshBall.style.left='4px';freshBall.style.right='auto';}else{freshBall.style.right='4px';freshBall.style.left='auto';}});freshBall.addEventListener('mousedown',function(e){if(callState!=='active')return;ballDragging=true;ballMoved=false;const pos=e;ballStartX=pos.clientX;ballStartY=pos.clientY;const r=freshBall.getBoundingClientRect();ballLeft=r.left;ballTop=r.top;freshBall.style.right='auto';freshBall.style.bottom='auto';freshBall.style.left=ballLeft+'px';freshBall.style.top=ballTop+'px';e.preventDefault();});document.addEventListener('mousemove',function(e){if(!ballDragging)return;ballMoved=true;let l=ballLeft+(e.clientX-ballStartX);let tp=ballTop+(e.clientY-ballStartY);l=Math.max(4,Math.min(window.innerWidth-58,l));tp=Math.max(60,Math.min(window.innerHeight-160,tp));freshBall.style.left=l+'px';freshBall.style.top=tp+'px';e.preventDefault();});document.addEventListener('mouseup',function(e){if(!ballDragging)return;ballDragging=false;if(!ballMoved&&callState==='active'){restoreCall();return;}const r=freshBall.getBoundingClientRect();if(r.left+r.width/2<window.innerWidth/2){freshBall.style.left='4px';freshBall.style.right='auto';}else{freshBall.style.right='4px';freshBall.style.left='auto';}});}updateHome();startAutoSendIfNeeded();console.log('✅ V16 已启动（localStorage模式）');const emojiItems=['😊','😂','🥰','😘','❤️','💕','🌟','✨','🌸','🎉','😢','😍','🌙','☀️','💔','🔥','👋'];let cardData=JSON.parse(localStorage.getItem('wordcards')||'[]');let movedCount=0;cardData.forEach(c=>{if(emojiItems.includes(c.content)&&c.groupName!=='表情符号'){c.groupId='表情符号';c.groupName='表情符号';movedCount++;}});if(movedCount>0){localStorage.setItem('wordcards',JSON.stringify(cardData));console.log('✅ 自动修复：',movedCount,'个表情符号已移到「表情符号」分组');}const refreshPage=localStorage.getItem('refreshToPage');if(refreshPage==='wordcardLibraryPage'){const refreshGroup=localStorage.getItem('refreshToGroup')||'';localStorage.removeItem('refreshToPage');localStorage.removeItem('refreshToGroup');setTimeout(()=>{showPage('wordcardLibraryPage');renderWordCardLibrary();if(refreshGroup){setTimeout(()=>{const groups=document.querySelectorAll('.group-item .group-info');groups.forEach(el=>{if(el.textContent.includes(refreshGroup)){el.click();}});},300);}},200);}if(!localStorage.getItem('emojiGroups')){localStorage.setItem('emojiGroups',JSON.stringify(['全部']));}const emojisData=JSON.parse(localStorage.getItem('emojis')||'[]');const newEmojisData=emojisData.map(e=>{if(e.group)return e;return{...e,group:'全部'};});localStorage.setItem('emojis',JSON.stringify(newEmojisData));setTimeout(function(){applyBubbleStyle();},300);const groupsData=localStorage.getItem('wordcardGroups');if(groupsData){try{const parsed=JSON.parse(groupsData);if(!Array.isArray(parsed)){const allCards=JSON.parse(localStorage.getItem('wordcards')||'[]');const groupsMap={};allCards.forEach(c=>{const gid=c.groupId||'default';const gname=c.groupName||'默认分组';if(!groupsMap[gid]){groupsMap[gid]={id:gid,name:gname,count:0};}groupsMap[gid].count++;});const groupsArray=Object.values(groupsMap);localStorage.setItem('wordcardGroups',JSON.stringify(groupsArray));console.log('✅ 分组数据已重建，共',groupsArray.length,'个分组');}}catch(e){console.log('分组数据格式错误，已跳过');}}}

init();
</script>
