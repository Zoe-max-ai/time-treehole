<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>秦彻和笑笑的时光树洞</title>
    <style>
        :root{--primary:#ff6b81;--bg:#f8f8f8;--text:#333;--text-light:#999;--text-lighter:#bbb;--border:#f0f0f0;--shadow:0 2px 12px rgba(0,0,0,0.06);--radius:16px;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f0f0;color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;}
        @supports(padding-top:env(safe-area-inset-top)){body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}}
        .page{display:none;flex-direction:column;height:100%;overflow:hidden;background:#f8f8f8;}
        .page.active{display:flex;}
        .navbar{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);flex-shrink:0;position:relative;min-height:48px;}
        .navbar .back-btn{position:absolute;left:16px;width:36px;height:36px;border-radius:50%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;border:none;color:var(--text);z-index:1;}
        .navbar .title{font-size:17px;font-weight:600;}
        .home-page-inner{background:#fff5f7;display:flex;flex-direction:column;height:100%;}
    .home-top-area{text-align:center;padding:80px 20px 8px;flex-shrink:0;}
        .home-avatar-group{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
        .home-avatar-img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,0.1);}
        .home-avatar-name{font-size:11px;font-weight:600;margin-top:4px;}
        .home-heart{font-size:20px;color:var(--primary);animation:heartBeat 1.5s infinite;}
        @keyframes heartBeat{0%,100%{transform:scale(1);}25%{transform:scale(1.15);}50%{transform:scale(1);}75%{transform:scale(1.1);}}
        .home-status-tag{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:18px;font-size:12px;margin-top:4px;background:#f0f9f0;color:#4a8a4a;border:1px solid #d0e8d0;}
        .home-status-dot{width:6px;height:6px;border-radius:50%;background:#4cd964;}
  .home-mood-preview{font-size:12px;color:var(--text-light);font-style:italic;margin-top:6px;}
.home-divider{display:flex;align-items:center;padding:0 20px;margin-top:12px;margin-bottom:16px;flex-shrink:0;width:100%;}
.home-divider .line{flex:1;height:1px;background:#ccc;}
.home-divider .label{padding:0 12px;font-size:11px;color:#333;}
.home-grid-scroll{flex:1;overflow-y:auto;padding:24px 14px 14px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;align-content:start;}
.home-card{background:transparent;border-radius:0;padding:0;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:none;box-shadow:none;}
.home-card:active{transform:scale(0.95);}
.home-card .card-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.5);backdrop-filter:blur(2px);border:1px solid rgba(255,255,255,0.3);box-shadow:0 2px 8px rgba(0,0,0,0.02);}
.home-card .card-icon svg{width:26px;height:26px;}
.home-card .card-title{font-size:11px;font-weight:400;color:#333;margin-top:4px;}
.home-card .card-desc{display:none;}
.home-footer{text-align:center;padding:8px;flex-shrink:0;font-size:9px;color:#ccc;}
        .chat-topbar{background:#fff;padding:8px 12px;display:flex;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0;min-height:42px;gap:8px;}
        .chat-topbar .back-arrow{width:30px;height:30px;border-radius:50%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;border:none;color:var(--text);flex-shrink:0;}
        .chat-topbar .romantic-quote{flex:1;text-align:center;font-size:12px;color:#c0a0c0;font-style:italic;cursor:pointer;}
        .chat-topbar .chat-settings-cat{font-size:20px;cursor:pointer;flex-shrink:0;padding:2px 4px;}
        .chat-area{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:12px;background:#f8f8f8;background-size:cover;background-position:center;background-repeat:no-repeat;}
        .system-msg{text-align:center;font-size:10px;color:var(--text-lighter);padding:3px 0;}
        .message-wrapper{display:flex;flex-direction:column;max-width:78%;}
        .message-wrapper.left{align-self:flex-start;}.message-wrapper.right{align-self:flex-end;align-items:flex-end;}
        .message-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;margin-bottom:3px;cursor:pointer;}
        .bubble{padding:9px 14px 9px 12px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word;position:relative;}
        .message-wrapper.left .bubble{background:#fff;color:#333;border-bottom-left-radius:4px;}
        .message-wrapper.right .bubble{background:#ffe0e6;color:#333;border-bottom-right-radius:4px;}
        .read-check{position:absolute;bottom:1px;right:3px;font-size:9px;color:#c0b0b0;opacity:0.6;line-height:1;pointer-events:none;}
        .message-time{font-size:9px;color:var(--text-lighter);margin-top:1px;padding:0 3px;}
        .message-wrapper.left .message-time{margin-left:32px;}
        .message-wrapper.right .message-time{text-align:right;margin-right:2px;}
        .pat-bubble{background:#fff9e6!important;color:#8a7a4a!important;font-style:italic;font-size:13px!important;}
        .typing-indicator{font-size:11px;color:var(--text-lighter);padding:4px 12px;font-style:italic;animation:blink 1.5s infinite;}
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.4;}}
        .bottombar{background:rgba(255,255,255,0.98);padding:8px 10px;display:flex;align-items:center;gap:5px;border-top:1px solid var(--border);flex-shrink:0;min-height:48px;position:sticky;bottom:0;}
        @supports(padding-bottom:env(safe-area-inset-bottom)){.bottombar{padding-bottom:calc(8px + env(safe-area-inset-bottom));}}
        .bottombar .icon-btn{width:34px;height:34px;border-radius:10px;background:#f8f8f8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;border:none;color:#666;transition:all .15s;flex-shrink:0;}
        .bottombar input{flex:1;border:1.5px solid transparent;border-radius:18px;padding:8px 12px;font-size:14px;outline:none;background:#f5f5f5;min-width:0;}
        .bottombar .send-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:15px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
        .emoji-panel{display:none;background:#fff;border-top:1px solid var(--border);flex-shrink:0;max-height:240px;flex-direction:column;}
        .emoji-panel.show{display:flex;}
        .emoji-panel .emoji-tabs{display:flex;border-bottom:1px solid #f0f0f0;flex-shrink:0;}
        .emoji-panel .emoji-tab{flex:1;padding:9px;text-align:center;font-size:12px;cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;color:var(--text-light);}
        .emoji-panel .emoji-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
        .emoji-panel .tab-content{overflow-y:auto;flex:1;padding:8px;}
        .pat-effect{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-size:14px;color:var(--primary);background:rgba(255,255,255,0.97);padding:10px 20px;border-radius:20px;z-index:999;pointer-events:none;animation:patBounce 1.6s ease forwards;}
        @keyframes patBounce{0%{opacity:0;transform:translate(-50%,-50%)scale(.3);}15%{opacity:1;transform:translate(-50%,-50%)scale(1.1);}60%{transform:translate(-50%,-50%)scale(.95);}85%{opacity:1;transform:translate(-50%,-50%)scale(1);}100%{opacity:0;transform:translate(-50%,-50%)scale(.8);}}
        .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.78);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;pointer-events:none;animation:toastInOut 2s ease;}
        @keyframes toastInOut{0%{opacity:0;transform:translate(-50%,-50%)scale(.85);}12%{opacity:1;transform:translate(-50%,-50%)scale(1.02);}80%{opacity:1;transform:translate(-50%,-50%)scale(1);}100%{opacity:0;transform:translate(-50%,-50%)scale(.9);}}
        input[type="file"]{display:none;}
        .generic-content{flex:1;overflow-y:auto;padding:12px;}
        .settings-section{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
        .settings-section h4{font-size:13px;color:var(--text-light);margin-bottom:8px;}
        .settings-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f8f8f8;}
        .avatar-row{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 0;}
        .small-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #f0f0f0;}
        .avatar-history-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
        .avatar-history-item{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid transparent;cursor:pointer;position:relative;}
        .avatar-history-item.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,129,0.2);}
        .avatar-history-item .ah-del{position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:#ff4757;border-radius:50%;color:#fff;font-size:8px;display:flex;align-items:center;justify-content:center;}
        .toggle-switch{width:44px;height:24px;border-radius:12px;background:#ddd;cursor:pointer;position:relative;transition:all .2s;flex-shrink:0;}
        .toggle-switch.on{background:var(--primary);}
        .toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:all .2s;}
        .toggle-switch.on::after{left:22px;}
        .call-fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;z-index:500;background:linear-gradient(180deg,#1a1a2e,#16213e,#0f3460);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;max-width:480px;margin:0 auto;}
        .call-fullscreen.show{display:flex;}
        .call-avatar-lg{width:100px;height:100px;border-radius:50%;object-fit:cover;margin-bottom:20px;border:3px solid rgba(255,255,255,0.3);}
        .call-avatar-lg.ringing{animation:callPulse 1.5s infinite;}
        @keyframes callPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,129,0.4);}50%{box-shadow:0 0 0 25px rgba(255,107,129,0);}}
        .call-float-ball{display:none;position:fixed;z-index:600;width:54px;height:54px;border-radius:50%;background:#1a1a2e;box-shadow:0 4px 20px rgba(0,0,0,0.35);cursor:pointer;align-items:center;justify-content:center;touch-action:none;}
        .call-float-ball.show{display:flex;}
        .call-float-ball .ball-end{position:absolute;top:-8px;right:-8px;background:#ff4757;color:#fff;width:20px;height:20px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
        .chat-settings-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:280;justify-content:center;align-items:flex-end;}
        .chat-settings-overlay.show{display:flex;}
        .chat-settings-panel{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;}
        .profile-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:250;justify-content:center;align-items:flex-end;}
        .profile-overlay.show{display:flex;}
        .profile-card{background:#fff;border-radius:22px 22px 0 0;padding:24px 18px;width:100%;max-width:480px;max-height:70vh;overflow-y:auto;text-align:center;}
        .emoji-manage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
        .emoji-manage-item{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;background:#fafafa;border:1px solid #f0f0f0;}
        .emoji-manage-item img{width:100%;height:100%;object-fit:cover;padding:4px;border-radius:8px;}
        .emoji-manage-item .del-overlay{position:absolute;top:3px;right:3px;width:18px;height:18px;background:rgba(255,71,87,0.9);border-radius:50%;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;}
        .add-emoji-area{border:2px dashed #ddd;border-radius:10px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:28px;color:#ccc;cursor:pointer;}
        .wordcard-content{flex:1;overflow-y:auto;padding:12px;}
        .wordcard-top-bar{display:flex;gap:6px;margin-bottom:6px;}
        .wordcard-top-bar button{flex:1;padding:8px 6px;border-radius:14px;border:none;cursor:pointer;font-size:10px;font-weight:500;}
        .wordcard-search{width:100%;padding:8px 12px;border-radius:14px;border:1.5px solid #eee;font-size:12px;outline:none;margin-bottom:6px;}
        .wordcard-global-search{width:100%;padding:8px 12px;border-radius:14px;border:1.5px solid var(--primary);font-size:12px;outline:none;margin-bottom:8px;background:#fff5f7;}
        .wordcard-groups-section{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--shadow);}
        .group-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;cursor:pointer;border-bottom:1px solid #f8f8f8;}
        .add-group-row{display:flex;gap:6px;margin-top:8px;}
        .add-group-row input{flex:1;padding:8px 12px;border-radius:14px;border:1.5px solid #eee;font-size:12px;outline:none;}
        .add-group-row button{padding:8px 14px;border-radius:14px;background:var(--primary);color:#fff;border:none;font-size:12px;cursor:pointer;white-space:nowrap;}
        .wordcard-list-item{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:8px;border-bottom:1px solid #f5f5f5;font-size:13px;}
        .bubble-preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}
        .bubble-preset-item{padding:10px 6px;border-radius:12px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s;font-size:11px;}
        .bubble-preset-item.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,129,0.15);}
        .mini-bubble{padding:6px 8px;border-radius:12px;font-size:10px;margin:3px 0;max-width:80%;}
        .mini-bubble.me{align-self:flex-end;border-bottom-right-radius:3px;margin-left:auto;}
        .mini-bubble.other{align-self:flex-start;border-bottom-left-radius:3px;}
        .batch-add-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:300;justify-content:center;align-items:center;}
        .batch-add-modal.show{display:flex;}
        .batch-add-modal .modal-content{background:#fff;border-radius:16px;padding:20px;width:90%;max-width:380px;max-height:80vh;display:flex;flex-direction:column;}
        .batch-add-modal textarea{flex:1;border:1.5px solid #eee;border-radius:12px;padding:12px;font-size:14px;resize:none;outline:none;min-height:120px;}
        .batch-add-modal select{width:100%;padding:10px;border-radius:12px;border:1.5px solid #eee;font-size:14px;outline:none;background:#fff;margin:8px 0;}
        .stat-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
        .stat-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;}
        .stat-value{font-weight:600;color:var(--primary);}
        .action-btn{width:100%;padding:12px;border-radius:10px;border:none;font-size:14px;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px;}
        .bg-preset-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
        .bg-preset-item{aspect-ratio:1;border-radius:10px;cursor:pointer;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:18px;}
        .bg-preset-item.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,129,0.2);}
        .emoji-group-tabs{display:flex;gap:6px;padding:6px 10px;flex-wrap:wrap;border-bottom:1px solid #f0f0f0;background:#fafafa;}
        .emoji-group-tab{padding:4px 12px;border-radius:12px;font-size:12px;cursor:pointer;border:none;background:transparent;color:#999;transition:all 0.2s;}
        .emoji-group-tab.active{background:var(--primary);color:#fff;}
        .emoji-group-tab.add{background:#f0f0f0;color:#666;font-size:14px;padding:4px 10px;}
    </style>
</head>
<body>
<div class="page active" id="homePage"><div class="home-page-inner" id="homeInner">
    <div class="home-top-area"><div class="home-avatar-group"><div><img class="home-avatar-img" id="homeContactAvatar" src=""><div class="home-avatar-name" id="homeContactName">秦彻</div></div><div class="home-heart">💕</div><div><img class="home-avatar-img me" id="homeMyAvatar" src=""><div class="home-avatar-name" id="homeMyName">笑笑</div></div></div><div class="home-status-tag"><span class="home-status-dot"></span><span id="homeStatusText">在线</span></div><div class="home-mood-preview" id="homeMoodPreview"></div></div>
    <div class="home-divider"><span class="line"></span><span class="label">我们的时光</span><span class="line"></span></div>
   <div class="home-grid-scroll">
    <div class="home-card" onclick="openChatPage()"><div class="card-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d4a8b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><div class="card-title">聊天</div></div>
    <div class="home-card" onclick="openOurUniverse()"><div class="card-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d4a8b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div><div class="card-title">我们的宇宙</div></div>
    <div class="home-card" onclick="openWordCardLibrary()"><div class="card-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d4a8b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4a2 2 0 0 1 2-2h10l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4z"/><polyline points="16 2 16 8 22 8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="14" y2="16"/></svg></div><div class="card-title">字卡库</div></div>
    <div class="home-card" onclick="openEmojiManage()"><div class="card-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d4a8b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></div><div class="card-title">表情包管理</div></div>

<script>
// ============ localStorage 数据管理 ============
function lsGet(key){try{const d=localStorage.getItem(key);return d?JSON.parse(d):[];}catch(e){console.error('lsGet错误:',e);return[];}}
function lsSet(key,data){try{localStorage.setItem(key,JSON.stringify(data));}catch(e){console.error('lsSet错误:',e);}}
function lsAdd(key,item){try{const data=lsGet(key);if(!item.id)item.id=Date.now()+Math.random()*1000;data.push(item);lsSet(key,data);return item.id;}catch(e){console.error('lsAdd错误:',e);return null;}}
function lsClear(key){localStorage.removeItem(key);}
function lsDelete(key,id){try{const data=lsGet(key);const filtered=data.filter(item=>item.id!==id);lsSet(key,filtered);}catch(e){console.error('lsDelete错误:',e);}}
async function dbPut(store,data){if(store==='settings'||store==='bgSettings'){const existing=lsGet(store);const idx=existing.findIndex(x=>x.key===data.key);if(idx>=0)existing[idx]=data;else existing.push(data);lsSet(store,existing);return data.key;}return lsAdd(store,data);}
async function dbGetAll(store){return lsGet(store);}
async function dbClear(store){lsClear(store);}
async function dbDelete(store,id){lsDelete(store,id);}
async function openDB(){return true;}

// ============ 全局状态 ============
let S={contactName:'秦彻',contactStatus:'在线',myName:'笑笑',minReplyTime:'1',maxReplyTime:'5',replyCount:'1',myAvatar:'',contactAvatar:'',contactMood:'',chatBgImage:'',homeBgImage:'',homeBg:'default',chatBg:'default',bubbleStyle:'default',topQuote:'✨ 在所有物是人非的景色里，我最喜欢你 ✨',chatSettings:{quoteReply:true,readReceipt:'text',readNotReply:false,typing:true,autoSend:false,autoSendInterval:'10',emojiMix:true,simCall:true}};
let patOptions=['拍了拍你的小脑袋','戳了戳你的脸颊','轻轻地拍了拍你'];
let callInterval=null,callSeconds=0,callStartTime=null,callState='idle',callDirection='out';
let autoSendTimer=null;
let ballDragging=false,ballStartX=0,ballStartY=0,ballLeft=0,ballTop=0,ballMoved=false;
const SYSTEM_GROUPS=[];
const BUBBLE_PRESETS=[{id:'default',name:'默认粉白',myBg:'#ffe0e6',myText:'#333',otherBg:'#ffffff',otherText:'#333'},{id:'warm',name:'暖阳橘',myBg:'#ffe8cc',myText:'#5a3a1a',otherBg:'#fffdf5',otherText:'#5a3a1a'},{id:'ocean',name:'海洋蓝',myBg:'#d4e8ff',myText:'#1a3a5a',otherBg:'#f5f8ff',otherText:'#1a3a5a'},{id:'mint',name:'薄荷绿',myBg:'#d4f0e0',myText:'#1a4a2a',otherBg:'#f5fff7',otherText:'#1a4a2a'},{id:'purple',name:'薰衣草',myBg:'#e8d8f8',myText:'#3a1a5a',otherBg:'#fdf5ff',otherText:'#3a1a5a'},{id:'dark',name:'暗夜模式',myBg:'#3d3d3d',myText:'#e0e0e0',otherBg:'#2a2a2a',otherText:'#d0d0d0'}];

// ============ 工具函数 ============
function getAvatar(t){const d=t==='contact'?S.contactAvatar:S.myAvatar;return d||'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"%3E%3Ccircle cx="50" cy="50" r="50" fill="%23'+(t==='contact'?'ffecd2':'a8edea')+'"/%3E%3C/svg%3E';}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));const pg=document.getElementById(id);if(pg)pg.classList.add('active');}
function goHome(){if(callState==='active')minimizeCall();showPage('homePage');updateHome();}
function showToast(m){const e=document.querySelector('.toast');if(e)e.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
function fmtTime(ts){const d=new Date(ts),n=new Date();const h=d.getHours().toString().padStart(2,'0'),m=d.getMinutes().toString().padStart(2,'0');if(d.toDateString()===n.toDateString())return'今天 '+h+':'+m;const y=new Date(n);y.setDate(y.getDate()-1);if(d.toDateString()===y.toDateString())return'昨天 '+h+':'+m;return(d.getMonth()+1)+'/'+d.getDate()+' '+h+':'+m;}
function scrollBottom(){requestAnimationFrame(()=>{const ca=document.getElementById('chatArea');if(ca)ca.scrollTop=ca.scrollHeight;});}
function applyBubbleStyle(){const preset=BUBBLE_PRESETS.find(p=>p.id===S.bubbleStyle)||BUBBLE_PRESETS[0];document.documentElement.style.setProperty('--bubble-my-bg',preset.myBg);document.documentElement.style.setProperty('--bubble-my-text',preset.myText);document.documentElement.style.setProperty('--bubble-other-bg',preset.otherBg);document.documentElement.style.setProperty('--bubble-other-text',preset.otherText);const chatArea=document.getElementById('chatArea');if(chatArea){chatArea.querySelectorAll('.message-wrapper.right .bubble').forEach(el=>{el.style.background=preset.myBg;el.style.color=preset.myText;});chatArea.querySelectorAll('.message-wrapper.left .bubble').forEach(el=>{el.style.background=preset.otherBg;el.style.color=preset.otherText;});}}
function updateHome(){document.getElementById('homeContactAvatar').src=getAvatar('contact');document.getElementById('homeMyAvatar').src=getAvatar('me');document.getElementById('homeContactName').textContent=S.contactName;document.getElementById('homeMyName').textContent=S.myName;document.getElementById('homeStatusText').textContent=S.contactStatus;document.getElementById('homeMoodPreview').textContent=S.contactMood||'';}

// ============ 聊天功能 ============
function openChatPage(){showPage('chatPage');document.getElementById('chatTopQuote').textContent=S.topQuote;loadMessages();loadEmojiPanel();applyBubbleStyle();startAutoSendIfNeeded();const btn=document.getElementById('sendBtn');btn.removeEventListener('click',sendMessage);btn.addEventListener('click',sendMessage);}
async function loadMessages(){const msgs=await dbGetAll('messages');msgs.sort((a,b)=>a.timestamp-b.timestamp);const ca=document.getElementById('chatArea');ca.innerHTML='';if(msgs.length===0){ca.innerHTML='<div style="text-align:center;color:#ccc;padding:40px;">💬 开始你们的对话吧</div>';}msgs.forEach(m=>renderMsg(m));scrollBottom();setTimeout(()=>applyBubbleStyle(),100);}
function renderMsg(m){const ca=document.getElementById('chatArea');const empty=ca.querySelector('#emptyChat');if(empty)empty.remove();if(m.type==='system'){const s=document.createElement('div');s.className='system-msg';s.textContent=m.content;ca.appendChild(s);return;}const w=document.createElement('div');w.className='message-wrapper '+(m.sender==='me'?'right':'left');const av=document.createElement('img');av.className='message-avatar';av.src=m.sender==='me'?getAvatar('me'):getAvatar('contact');if(m.sender==='other')av.onclick=function(){openProfile();};const b=document.createElement('div');b.className='bubble';const preset=BUBBLE_PRESETS.find(p=>p.id===S.bubbleStyle)||BUBBLE_PRESETS[0];if(m.sender==='me'){b.style.background=preset.myBg;b.style.color=preset.myText;}else{b.style.background=preset.otherBg;b.style.color=preset.otherText;}if(m.type==='pat'){b.classList.add('pat-bubble');b.innerHTML='<span>👋 <b>'+(m.sender==='me'?S.myName:S.contactName)+'</b> '+m.content+'</span>';}else if(m.type==='emoji'||m.type==='image'){const img=document.createElement('img');img.src=m.content;img.style.maxWidth='150px';img.style.maxHeight='150px';img.style.objectFit='contain';img.style.borderRadius='6px';b.appendChild(img);}else{b.textContent=m.content;}const t=document.createElement('div');t.className='message-time';t.textContent=fmtTime(m.timestamp);w.appendChild(av);w.appendChild(b);w.appendChild(t);ca.appendChild(w);scrollBottom();}
async function sendMessage(){const input=document.getElementById('messageInput');const c=input.value.trim();if(!c)return;const msg={sender:'me',content:c,type:'text',timestamp:Date.now()};try{const id=await dbPut('messages',msg);msg.id=id;renderMsg(msg);scrollBottom();input.value='';document.getElementById('sendBtn').disabled=true;autoReply();setTimeout(()=>{document.getElementById('sendBtn').disabled=false;},800);}catch(e){console.error('❌ 发送消息失败:',e);showToast('❌ 发送失败，请重试');document.getElementById('sendBtn').disabled=false;}}
async function autoReply(){const cs=S.chatSettings;if(cs.readReceipt!=='none'){setTimeout(()=>{if(cs.readReceipt==='graphic'){var myMsgs=document.querySelectorAll('.message-wrapper.right .bubble');if(myMsgs.length>0){var lastBubble=myMsgs[myMsgs.length-1];if(!lastBubble.querySelector('.read-check')){var ck=document.createElement('span');ck.className='read-check';ck.textContent='✓';lastBubble.appendChild(ck);}}}else{addSysMsg('📖 秦彻已读（'+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+'）');}},800+Math.random()*1200);}if(cs.readNotReply&&Math.random()<0.4){addSysMsg('💤 秦彻已读但未回复');return;}const min=parseInt(S.minReplyTime)||1,max=parseInt(S.maxReplyTime)||5,cnt=parseInt(S.replyCount)||1;const delay=Math.floor(Math.random()*(max*60000-min*1000+1))+min*1000;if(cs.typing){setTimeout(()=>{const ti=document.createElement('div');ti.className='typing-indicator';ti.id='typingIndicator';ti.textContent='秦彻正在输入...';document.getElementById('chatArea').appendChild(ti);scrollBottom();},delay-2000);}setTimeout(async()=>{const ti=document.getElementById('typingIndicator');if(ti)ti.remove();for(let i=0;i<cnt;i++){let c=Math.random()<0.5?await smartComposeReply():await getRandomReply();if(S.chatSettings.quoteReply&&Math.random()<0.1){const allMessages=await dbGetAll('messages');const userMessages=allMessages.filter(m=>m.sender==='me');if(userMessages.length>0){const randomIndex=Math.floor(Math.random()*userMessages.length);const randomMsg=userMessages[randomIndex];if(randomMsg&&randomMsg.content){c='"'+randomMsg.content+'"…… '+c;}}}const m={sender:'other',content:c,type:'text',timestamp:Date.now()};const id=await dbPut('messages',m);m.id=id;renderMsg(m);scrollBottom();if(cs.emojiMix&&Math.random()<0.15){const emojiList=await dbGetAll('emojis');if(emojiList.length>0){const img=emojiList[Math.floor(Math.random()*emojiList.length)];const imgMsg={sender:'other',content:img.data,type:'image',timestamp:Date.now()};const imgId=await dbPut('messages',imgMsg);imgMsg.id=imgId;renderMsg(imgMsg);scrollBottom();}}if(Math.random()<0.05&&patOptions.length>0){const pat=patOptions[Math.floor(Math.random()*patOptions.length)];const patMsg={sender:'other',content:pat,type:'pat',timestamp:Date.now()};const patId=await dbPut('messages',patMsg);patMsg.id=patId;renderMsg(patMsg);scrollBottom();triggerPat(S.contactName,pat);}if(cs.simCall&&Math.random()<0.01&&callState==='idle'){setTimeout(function(){startCallFromQinChe();},2000);}if(i<cnt-1)await new Promise(r=>setTimeout(r,800+Math.random()*3000));}},delay);}
async function getRandomReply(){const selectedGroups=JSON.parse(localStorage.getItem('chatGroups')||'[]');const cards=await dbGetAll('wordcards');const disabledCards=JSON.parse(localStorage.getItem('disabledCards')||'[]');const disabledIds=new Set(disabledCards.map(d=>String(d.cardId)));const valid=cards.filter(c=>{if(!c||!c.content)return false;if(c.content==='__GROUP_PLACEHOLDER__')return false;if(c.content.length<=1)return false;if(disabledIds.has(String(c.id)))return false;if(selectedGroups.length>0){return selectedGroups.includes(c.groupName)||selectedGroups.includes(c.groupId);}return true;});if(valid.length===0){return'😅 字卡库还是空的，先给我加点字卡吧～';}return valid[Math.floor(Math.random()*valid.length)].content;}
async function addSysMsg(c){const m={type:'system',content:c,timestamp:Date.now()};await dbPut('messages',m);renderMsg(m);}
async function smartComposeReply(){const selectedGroups=JSON.parse(localStorage.getItem('chatGroups')||'[]');const allCards=await dbGetAll('wordcards');const disabledCards=JSON.parse(localStorage.getItem('disabledCards')||'[]');const disabledIds=new Set(disabledCards.map(d=>String(d.cardId)));const validCards=allCards.filter(c=>{if(!c||!c.content)return false;if(c.content==='__GROUP_PLACEHOLDER__')return false;if(c.content.length<=1)return false;if(disabledIds.has(String(c.id)))return false;if(selectedGroups.length>0){return selectedGroups.includes(c.groupName)||selectedGroups.includes(c.groupId);}return true;});if(validCards.length===0){return'😅 字卡库还是空的，先给我加点字卡吧～';}const count=Math.min(Math.floor(Math.random()*5)+2,validCards.length);const shuffled=validCards.sort(()=>Math.random()-0.5);const selected=shuffled.slice(0,count);let sentence=selected.map(c=>c.content).join(' ');return sentence;}
async function handleImageMessage(event){const f=event.target.files[0];if(!f)return;const d=await fileToDataUrl(f);const msg={sender:'me',content:d,type:'image',timestamp:Date.now()};const id=await dbPut('messages',msg);msg.id=id;renderMsg(msg);autoReply();event.target.value='';}
function fileToDataUrl(f){return new Promise(r=>{const rd=new FileReader();rd.onload=function(){r(rd.result);};rd.readAsDataURL(f);});}
function compressImage(file,maxWidth,maxHeight){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=function(e){const img=new Image();img.onload=function(){const canvas=document.createElement('canvas');let width=img.width;let height=img.height;if(width>maxWidth||height>maxHeight){const ratio=Math.min(maxWidth/width,maxHeight/height);width=Math.floor(width*ratio);height=Math.floor(height*ratio);}canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,width,height);resolve(canvas.toDataURL('image/jpeg',0.6));};img.onerror=reject;img.src=e.target.result;};reader.onerror=reject;reader.readAsDataURL(file);});}

// ============ 表情面板 ============
function getEmojiGroups(){let groups=JSON.parse(localStorage.getItem('emojiGroups')||'["全部"]');const emojis=JSON.parse(localStorage.getItem('emojis')||'[]');const groupSet=new Set(groups);emojis.forEach(e=>{if(e.group&&e.group!=='')groupSet.add(e.group);});const result=Array.from(groupSet).filter(g=>g!==''&&g!==null&&g!==undefined);if(result.length===0)result.push('全部');localStorage.setItem('emojiGroups',JSON.stringify(result));return result;}
function switchEmojiGroup(group){localStorage.setItem('currentEmojiGroup',group);loadEmojiPanel();}
function sendEmoji(id){dbGetAll('emojis').then(emojis=>{const e=emojis.find(item=>item.id==id);if(e&&e.data){try{const testKey='__emj_test_'+Date.now();localStorage.setItem(testKey,'1');localStorage.removeItem(testKey);}catch(err){showToast('⚠️ 存储空间不足，请清理旧表情');return;}const m={sender:'me',content:e.data,type:'emoji',timestamp:Date.now()};dbPut('messages',m).then(function(newId){m.id=newId;renderMsg(m);scrollBottom();autoReply();}).catch(function(err){console.error('发送表情失败:',err);showToast('发送失败，请重试');});}});}
function addEmojiGroup(){const overlay=document.createElement('div');overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;';overlay.innerHTML='<div style="background:#fff;border-radius:16px;padding:24px;width:300px;box-shadow:0 8px 30px rgba(0,0,0,0.2);"><div style="font-size:16px;font-weight:600;color:#333;margin-bottom:16px;text-align:center;">新建表情包分组</div><input type="text" id="newEmojiGroupName2" placeholder="输入分组名称..." style="width:100%;padding:12px;border-radius:10px;border:1.5px solid #e8e0d8;font-size:14px;outline:none;box-sizing:border-box;margin-bottom:16px;"><div style="display:flex;gap:10px;"><button id="emojiGroupCancelBtn2" style="flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;background:#f5f5f5;color:#666;font-size:14px;cursor:pointer;">取消</button><button id="emojiGroupConfirmBtn2" style="flex:1;padding:10px;border-radius:10px;border:none;background:#d4a8b8;color:#fff;font-size:14px;cursor:pointer;">创建</button></div></div>';document.body.appendChild(overlay);document.getElementById('emojiGroupCancelBtn2').onclick=function(){overlay.remove();};document.getElementById('emojiGroupConfirmBtn2').onclick=function(){const name=document.getElementById('newEmojiGroupName2').value.trim();overlay.remove();if(!name){showToast('请输入分组名称');return;}const groups=JSON.parse(localStorage.getItem('emojiGroups')||'["全部"]');if(groups.includes(name)){showToast('分组已存在');return;}groups.push(name);localStorage.setItem('emojiGroups',JSON.stringify(groups));showToast('✅ 分组"'+name+'"已创建');loadEmojiPanel();};setTimeout(()=>{const input=document.getElementById('newEmojiGroupName2');if(input)input.focus();},300);}
function addEmojiGroupFromManage(){const overlay=document.createElement('div');overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;';overlay.innerHTML='<div style="background:#fff;border-radius:16px;padding:24px;width:300px;box-shadow:0 8px 30px rgba(0,0,0,0.2);"><div style="font-size:16px;font-weight:600;color:#333;margin-bottom:16px;text-align:center;">新建表情包分组</div><input type="text" id="newEmojiGroupName" placeholder="输入分组名称..." style="width:100%;padding:12px;border-radius:10px;border:1.5px solid #e8e0d8;font-size:14px;outline:none;box-sizing:border-box;margin-bottom:16px;"><div style="display:flex;gap:10px;"><button id="emojiGroupCancelBtn" style="flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;background:#f5f5f5;color:#666;font-size:14px;cursor:pointer;">取消</button><button id="emojiGroupConfirmBtn" style="flex:1;padding:10px;border-radius:10px;border:none;background:#d4a8b8;color:#fff;font-size:14px;cursor:pointer;">创建</button></div></div>';document.body.appendChild(overlay);document.getElementById('emojiGroupCancelBtn').onclick=function(){overlay.remove();};document.getElementById('emojiGroupConfirmBtn').onclick=function(){const name=document.getElementById('newEmojiGroupName').value.trim();overlay.remove();if(!name){showToast('请输入分组名称');return;}const groups=JSON.parse(localStorage.getItem('emojiGroups')||'["全部"]');if(groups.includes(name)){showToast('分组已存在');return;}groups.push(name);localStorage.setItem('emojiGroups',JSON.stringify(groups));showToast('✅ 分组"'+name+'"已创建');renderEmojiManage();loadEmojiPanel();};setTimeout(()=>{const input=document.getElementById('newEmojiGroupName');if(input)input.focus();},300);}
function deleteEmojiGroup(groupName){if(groupName==='全部'){showToast('不能删除默认分组');return;}if(!confirm('确定删除分组「'+groupName+'」吗？该分组下的表情包将移到「全部」'))return;let groups=JSON.parse(localStorage.getItem('emojiGroups')||'["全部"]');groups=groups.filter(g=>g!==groupName);localStorage.setItem('emojiGroups',JSON.stringify(groups));let emojis=JSON.parse(localStorage.getItem('emojis')||'[]');emojis=emojis.map(e=>{if(e.group===groupName){e.group='全部';}return e;});localStorage.setItem('emojis',JSON.stringify(emojis));showToast('✅ 已删除分组「'+groupName+'」');renderEmojiManage();loadEmojiPanel();}
async function loadEmojiPanel(){const emojiList=await dbGetAll('emojis');const groups=JSON.parse(localStorage.getItem('emojiGroups')||'["全部"]');const currentGroup=localStorage.getItem('currentEmojiGroup')||'全部';let html='<div class="emoji-group-tabs">'+groups.map(g=>'<button class="emoji-group-tab '+(g===currentGroup?'active':'')+'" onclick="switchEmojiGroup(\''+g+'\')">'+g+'</button>').join('')+'<button class="emoji-group-tab add" onclick="addEmojiGroup()">➕</button></div><div id="emojiGridArea" style="display:flex;flex-wrap:wrap;gap:8px;padding:8px;">';const filtered=currentGroup==='全部'?emojiList:emojiList.filter(e=>(e.group||'全部')===currentGroup);if(filtered.length===0){html+='<div style="color:#ccc;padding:20px;text-align:center;width:100%;">这个分组还没有表情包～</div>';}else{filtered.forEach(e=>{html+='<img src="'+e.data+'" style="width:48px;height:48px;object-fit:cover;cursor:pointer;border-radius:6px;" onclick="sendEmoji(\''+e.id+'\')">';});}html+='</div>';document.getElementById('emojiTabContent').innerHTML=html;}
function loadPatPanel(){const ct=document.getElementById('emojiTabContent');ct.innerHTML='<div id="patList" style="padding:4px;"></div>';const l=document.getElementById('patList');patOptions.forEach(p=>{const item=document.createElement('div');item.style.cssText='padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;background:#fafafa;font-size:13px;display:flex;align-items:center;gap:8px;';item.innerHTML='<span>👋</span><span>'+p+'</span>';item.onclick=async function(){const pm={sender:'me',content:p,type:'pat',timestamp:Date.now()};const id=await dbPut('messages',pm);pm.id=id;renderMsg(pm);toggleEmojiPanel();triggerPat(S.myName,p);};l.appendChild(item);});const row=document.createElement('div');row.style.cssText='display:flex;gap:5px;margin-top:6px;';row.innerHTML='<input type="text" id="newPatChat" placeholder="添加..." style="flex:1;padding:7px 10px;border-radius:12px;border:1.5px solid #eee;font-size:12px;outline:none;"><button onclick="addPatChat()" style="padding:7px 12px;border-radius:12px;background:var(--primary);color:#fff;border:none;font-size:12px;cursor:pointer;">添加</button>';l.appendChild(row);}
function addPatChat(){const v=document.getElementById('newPatChat').value.trim();if(!v)return;if(patOptions.includes(v)){showToast('已存在');return;}patOptions.push(v);localStorage.setItem('patOptions',JSON.stringify(patOptions));loadPatPanel();}
function triggerPat(name,text){const el=document.createElement('div');el.className='pat-effect';el.textContent='👋 '+name+' '+(text||'拍了拍你');document.body.appendChild(el);setTimeout(()=>el.remove(),1600);}
function switchEmojiTab(tab){document.querySelectorAll('.emoji-tab').forEach(t=>{t.classList.toggle('active',t.textContent.includes(tab==='emoji'?'表情':'拍一拍'));});if(tab==='emoji')loadEmojiPanel();else loadPatPanel();}
function toggleEmojiPanel(){const p=document.getElementById('emojiPanel');const b=document.getElementById('emojiToggleBtn');p.classList.toggle('show');b.classList.toggle('active',p.classList.contains('show'));if(p.classList.contains('show'))switchEmojiTab('emoji');}
async function handleEmojiUpload(event) {
    const files = event.target.files;
    if (!files || files.length === 0) return;
    
    const groups = JSON.parse(localStorage.getItem('emojiGroups') || '["全部"]');
    
    const group = await new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;';
        overlay.onclick = function(e) { if (e.target === this) { this.remove(); resolve('全部'); } };
        
        const panel = document.createElement('div');
        panel.style.cssText = 'background:#fff;border-radius:16px;padding:20px;width:300px;max-width:90%;box-shadow:0 4px 20px rgba(0,0,0,0.3);';
        panel.innerHTML = '<h4 style="margin-bottom:12px;text-align:center;">选择分组</h4>' +
            '<select id="emojiGroupSelect" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-bottom:12px;font-size:14px;">' +
            '<option value="">新建分组...</option>' +
            groups.map(g => '<option value="' + g + '">' + g + '</option>').join('') +
            '</select>' +
            '<input type="text" id="emojiNewGroupInput" placeholder="新分组名称..." style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-bottom:12px;font-size:14px;display:none;">' +
            '<div style="display:flex;gap:8px;">' +
            '<button id="emojiUploadCancelBtn" style="flex:1;padding:10px;border-radius:8px;border:none;background:#f0f0f0;cursor:pointer;font-size:14px;">取消</button>' +
            '<button id="confirmEmojiUploadBtn" style="flex:1;padding:10px;border-radius:8px;border:none;background:var(--primary);color:#fff;cursor:pointer;font-size:14px;">确定</button>' +
            '</div>';
        overlay.appendChild(panel);
        document.body.appendChild(overlay);
        
        const select = document.getElementById('emojiGroupSelect');
        const newInput = document.getElementById('emojiNewGroupInput');
        select.addEventListener('change', function() {
            newInput.style.display = this.value === '' ? 'block' : 'none';
        });
        
        document.getElementById('emojiUploadCancelBtn').addEventListener('click', function() {
            overlay.remove();
            resolve(null);
        });
        
        document.getElementById('confirmEmojiUploadBtn').addEventListener('click', function() {
            let selectedGroup = select.value;
            if (selectedGroup === '') {
                const newName = newInput.value.trim();
                if (newName) {
                    selectedGroup = newName;
                } else {
                    alert('请输入分组名称');
                    return;
                }
            }
            overlay.remove();
            resolve(selectedGroup);
        });
    });
    
    if (group === null) {
        event.target.value = '';
        return;
    }
    
    const finalGroup = group || '全部';
    let addedCount = 0;
    let skippedCount = 0;
    
    for (let f of files) {
        let d;
        if (f.size > 100 * 1024) {
            d = await compressImage(f, 150, 150);
        } else {
            d = await fileToDataUrl(f);
        }
        
        if (d.length > 300 * 1024) {
            skippedCount++;
            continue;
        }
        
        try {
            await dbPut('emojis', { data: d, group: finalGroup, timestamp: Date.now() });
            addedCount++;
        } catch(e) {
            skippedCount++;
        }
    }
    
    if (finalGroup !== '全部' && !groups.includes(finalGroup)) {
        groups.push(finalGroup);
        localStorage.setItem('emojiGroups', JSON.stringify(groups));
    }
    
    loadEmojiPanel();
    if (typeof renderEmojiManage === 'function') renderEmojiManage();
    
    let msg = '✅ 已添加' + addedCount + '个到「' + finalGroup + '」';
    if (skippedCount > 0) msg += '，跳过' + skippedCount + '个';
    showToast(msg);
    event.target.value = '';
}
function switchManageGroup(group){localStorage.setItem('manageEmojiGroup',group);renderEmojiManage();}

// ============ 通话功能 ============
function startCall(){if(callState!=='idle')return;callState='ringing';callDirection='out';callSeconds=0;const fs=document.getElementById('callFullscreen');fs.classList.add('show');document.getElementById('callAvatarLg').src=getAvatar('contact');document.getElementById('callAvatarLg').classList.add('ringing');document.getElementById('callNameLg').textContent=S.contactName;document.getElementById('callStatusLg').textContent='正在呼叫...';document.getElementById('callTimerLg').textContent='00:00:00';document.getElementById('callMinBtn').style.display='none';document.getElementById('answerBtn').style.display='none';addSysMsg('📞 你向秦彻发起了通话');setTimeout(()=>{if(callState==='ringing'&&callDirection==='out')answerCall();},3000);}
function startCallFromQinChe(){if(callState!=='idle')return;callState='ringing';callDirection='in';callSeconds=0;const fs=document.getElementById('callFullscreen');fs.classList.add('show');document.getElementById('callAvatarLg').src=getAvatar('contact');document.getElementById('callAvatarLg').classList.add('ringing');document.getElementById('callNameLg').textContent=S.contactName;document.getElementById('callStatusLg').textContent='秦彻来电...';document.getElementById('callTimerLg').textContent='00:00:00';document.getElementById('callMinBtn').style.display='none';document.getElementById('answerBtn').style.display='flex';addSysMsg('📞 秦彻向你发起了通话');}
function answerCall(){callState='active';callStartTime=Date.now();document.getElementById('callAvatarLg').classList.remove('ringing');document.getElementById('callStatusLg').textContent='通话中...';document.getElementById('callMinBtn').style.display='flex';document.getElementById('answerBtn').style.display='none';addSysMsg('📞 通话已接通');if(callInterval)clearInterval(callInterval);callInterval=setInterval(()=>{callSeconds++;updateCallTimer();updateBallTimer();},1000);}
function updateCallTimer(){const h=Math.floor(callSeconds/3600).toString().padStart(2,'0');const m=Math.floor((callSeconds%3600)/60).toString().padStart(2,'0');const s=(callSeconds%60).toString().padStart(2,'0');document.getElementById('callTimerLg').textContent=h+':'+m+':'+s;}
function updateBallTimer(){const m=Math.floor(callSeconds/60).toString().padStart(2,'0');const s=(callSeconds%60).toString().padStart(2,'0');document.getElementById('ballTimer').textContent=m+':'+s;}
function minimizeCall(){document.getElementById('callFullscreen').classList.remove('show');const ball=document.getElementById('callFloatBall');ball.classList.add('show');document.getElementById('ballAvatar').src=getAvatar('contact');updateBallTimer();ball.style.right='16px';ball.style.bottom='120px';ball.style.left='auto';ball.style.top='auto';}

async function getAllGroups(){const cards=JSON.parse(localStorage.getItem('wordcards')||'[]');const disabledGroups=JSON.parse(localStorage.getItem('disabledGroups')||'[]');const dgids=new Set(disabledGroups.map(d=>d.groupId));const groupsMap=new Map();cards.forEach(c=>{const gid=c.groupId||'default';const gname=c.groupName||'默认分组';if(!groupsMap.has(gid)){groupsMap.set(gid,{id:gid,name:gname,isSystem:false,disabled:dgids.has(gid),cardCount:0});}});cards.forEach(c=>{if(c.content==='__GROUP_PLACEHOLDER__')return;const gid=c.groupId||'default';if(groupsMap.has(gid))groupsMap.get(gid).cardCount++;});return Array.from(groupsMap.values());}
async function getCardsByGroup(gid){try{const cards=JSON.parse(localStorage.getItem('wordcards')||'[]');if(!Array.isArray(cards)){console.warn('wordcards不是数组，已修复');localStorage.setItem('wordcards',JSON.stringify([]));return[];}const disabledCards=JSON.parse(localStorage.getItem('disabledCards')||'[]');const dids=new Set(disabledCards.map(d=>String(d.cardId)));if(gid&&gid.startsWith('sys_')){const sg=SYSTEM_GROUPS.find(g=>g.id===gid);const userCards=cards.filter(c=>c&&(c.groupId||'default')===gid&&c.content&&c.content!=='__GROUP_PLACEHOLDER__').map(c=>({id:c.id,content:c.content,isSystem:false,disabled:dids.has(String(c.id)),groupId:gid}));const sysCards=sg?sg.words.map((w,i)=>({id:'sys_'+gid+'_'+i,content:w,isSystem:true,disabled:dids.has('sys_'+gid+'_'+i),groupId:gid})):[];const combined=[...sysCards,...userCards];const seen=new Set();const unique=combined.filter(c=>{if(seen.has(c.content))return false;seen.add(c.content);return true;});return unique;}const result=cards.filter(c=>{if(!c||!c.content||c.content==='__GROUP_PLACEHOLDER__')return false;const cardGid=c.groupId||'default';const cardGname=c.groupName||'';return cardGid===gid||cardGname===gid;}).map(c=>{const id=c.id||c._id||(c.groupId+'_'+c.content).replace(/\s/g,'_');return{id:id,content:c.content,isSystem:false,disabled:dids.has(String(id)),groupId:c.groupId||'default'};});return result;}catch(e){console.error('getCardsByGroup出错:',e);return[];}}

async function toggleCardDisable(cid, gid, isSys) {
    let disabledCards = JSON.parse(localStorage.getItem('disabledCards') || '[]');
    const strCid = String(cid);
    const index = disabledCards.findIndex(d => String(d.cardId) === strCid);
    if (index >= 0) {
        disabledCards.splice(index, 1);
    } else {
        disabledCards.push({ cardId: strCid });  // 
    }
    localStorage.setItem('disabledCards', JSON.stringify(disabledCards));
    
    const gname = document.querySelector('#wordcardDetailArea h4')?.textContent.replace('📋 ', '') || '';
    if (gname) viewGroupCards(gid, gname);
    renderGroupList();
    showToast(index >= 0 ? '已启用' : '已禁用');
    
    const searchContainer = document.getElementById('globalSearchResults');
    if (searchContainer && searchContainer.style.display !== 'none') {
        searchAllCardsAndDisplay();
    }
}
async function deleteCard(cid, gid, isSys) {
    if (!isSys) {
        let cards = JSON.parse(localStorage.getItem('wordcards') || '[]');
        cards = cards.filter(c => String(c.id) !== String(cid));
        localStorage.setItem('wordcards', JSON.stringify(cards));
    } else {
        let disabledCards = JSON.parse(localStorage.getItem('disabledCards') || '[]');
        if (!disabledCards.find(d => String(d.cardId) === String(cid))) {
            disabledCards.push({ cardId: String(cid) });  
            localStorage.setItem('disabledCards', JSON.stringify(disabledCards));
        }
    }
    const gname = document.querySelector('#wordcardDetailArea h4')?.textContent.replace('📋 ', '') || '';
    if (gname) viewGroupCards(gid, gname);
    renderGroupList();
    showToast(isSys ? '已禁用' : '已删除');
    const searchContainer = document.getElementById('globalSearchResults');
    if (searchContainer && searchContainer.style.display !== 'none') {
        searchAllCardsAndDisplay();
    }
}
async function moveCard(cid,fromGid){const oldModals=document.querySelectorAll('div[style*="z-index:999"]');oldModals.forEach(m=>m.remove());const groups=await getAllGroups();let groupListHtml='';groups.forEach(g=>{const safeGid=g.id.replace(/'/g,"\\'");const safeName=g.name.replace(/'/g,"\\'");groupListHtml+='<div onclick="confirmMoveCard(\''+cid+'\',\''+fromGid+'\',\''+safeGid+'\')" style="padding:10px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;"><span>'+safeName+'</span><span style="font-size:11px;color:var(--text-light);">'+(g.cardCount||0)+'条</span></div>';});const modal=document.createElement('div');modal.id='moveCardModal';modal.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;';modal.innerHTML='<div style="background:#fff;border-radius:16px;padding:20px;width:85%;max-width:400px;max-height:70vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,0.2);"><h4 style="text-align:center;margin-bottom:12px;font-size:16px;">📁 选择目标分组</h4><div style="max-height:50vh;overflow-y:auto;border:1px solid #eee;border-radius:10px;">'+groupListHtml+'</div><button id="moveCardCancelBtn" style="width:100%;margin-top:12px;padding:10px;border-radius:12px;background:#f0f0f0;border:none;cursor:pointer;font-size:14px;color:#666;">取消</button></div>';document.body.appendChild(modal);modal.addEventListener('click',function(e){if(e.target===modal){modal.remove();}});document.getElementById('moveCardCancelBtn').addEventListener('click',function(){modal.remove();});}
async function confirmMoveCard(cid, fromGid, targetGid) {
    const modals = document.querySelectorAll('#moveCardModal');
    modals.forEach(m => m.remove());
    
    const groups = await getAllGroups();
    const tg = groups.find(g => g.id === targetGid);
    if (!tg) { showToast('分组不存在'); return; }
    
    let cards = JSON.parse(localStorage.getItem('wordcards') || '[]');
    const card = cards.find(c => String(c.id) === String(cid));
    if (card) {
        card.groupId = targetGid;
        card.groupName = tg.name;
        localStorage.setItem('wordcards', JSON.stringify(cards));
        
        showToast('✅ 已移动到「' + tg.name + '」');
        
        const currentGname = document.querySelector('#wordcardDetailArea h4')?.textContent.replace('📋 ', '') || '';
        if (currentGname) {
            viewGroupCards(fromGid, currentGname);
        }
        renderGroupList();
        
        const searchContainer = document.getElementById('globalSearchResults');
        if (searchContainer && searchContainer.style.display !== 'none') {
            searchAllCardsAndDisplay();
        }
    }
}

async function createGroup(){const input=document.getElementById('newGroupInput');const v=input.value.trim();if(!v){showToast('请输入分组名称');return;}const gid='group_'+Date.now();let cards=JSON.parse(localStorage.getItem('wordcards')||'[]');const exists=cards.some(c=>c.groupName===v&&c.content==='__GROUP_PLACEHOLDER__');if(exists){showToast('分组已存在');return;}cards.push({groupId:gid,groupName:v,content:'__GROUP_PLACEHOLDER__',timestamp:Date.now()});try{localStorage.setItem('wordcards',JSON.stringify(cards));}catch(e){showToast('❌ 存储失败，请清理旧数据');return;}input.value='';renderGroupList();showToast('✅ 已创建分组「'+v+'」');}

async function confirmBatchAdd(){const textarea=document.getElementById('batchAddTextarea');const t=textarea.value;const lines=t.split('\n').map(l=>l.trim()).filter(l=>l);if(!lines.length){showToast('请输入字卡内容');return;}const selectEl=document.getElementById('batchGroupSelect');const gid=selectEl.value;const gn=selectEl.selectedOptions[0].textContent.replace(' (系统)','');let added=0,skipped=0;let allCards=JSON.parse(localStorage.getItem('wordcards')||'[]');if(!Array.isArray(allCards))allCards=[];const existingContents=new Set(allCards.filter(c=>c&&c.content&&c.content!=='__GROUP_PLACEHOLDER__').map(c=>c.content));for(let l of lines){if(existingContents.has(l)){skipped++;continue;}allCards.push({id:Date.now()+Math.random()*1000+added,groupId:gid,groupName:gn,content:l,timestamp:Date.now()});existingContents.add(l);added++;}try{localStorage.setItem('wordcards',JSON.stringify(allCards));}catch(e){showToast('❌ 存储失败，请清理旧数据');closeBatchAdd();return;}closeBatchAdd();renderGroupList();showToast('✅ 已添加'+added+'条'+(skipped>0?'，跳过'+skipped+'条重复':''));}
async function exportCardsJSON() {
    console.log('✅ exportCardsJSON 新版本已执行');  // ← 加这行
    const cards = JSON.parse(localStorage.getItem('wordcards') || '[]');
    const data = cards
        .filter(c => c.content !== '__GROUP_PLACEHOLDER__')
        .map(c => ({
            id: c.id || Date.now() + Math.random() * 1000,
            groupId: c.groupId || 'default',
            groupName: c.groupName || '默认分组',
            content: c.content
        }));
    downloadBlob(JSON.stringify(data, null, 2), '字卡导出.json');

async function importCardsFile(event){var f=event.target.files[0];if(!f)return;if(!f.text&&f.name){const reader=new FileReader();reader.onload=async function(e){try{var t=e.target.result;var d=JSON.parse(t);processImportedCards(d);}catch(err){showToast('导入失败：文件格式错误');}};reader.onerror=function(){showToast('❌ 文件读取失败，请重试');};reader.readAsText(f);event.target.value='';return;}try{var t=await f.text();var d=JSON.parse(t);processImportedCards(d);}catch(e){showToast('导入失败：'+e.message);}event.target.value='';}
function processImportedCards(d) {
    var allCards = JSON.parse(localStorage.getItem('wordcards') || '[]');
    var existing = new Set(allCards.filter(function(x) { return x.content && x.content !== '__GROUP_PLACEHOLDER__'; }).map(function(x) { return x.content; }));
    var count = 0;
    
    if (d.customReplies && d.customReplyGroups) {
        for (var g of d.customReplyGroups) {
            if (g.items && g.items.length > 0) {
                for (var item of g.items) {
                    if (!existing.has(item)) {
                        allCards.push({
                            id: Date.now() + Math.random() * 1000 + count,
                            groupId: g.id.toString(),
                            groupName: g.name,
                            content: item,
                            timestamp: Date.now()
                        });
                        existing.add(item);
                        count++;
                    }
                }
            }
        }
        for (var r of d.customReplies) {
            if (!existing.has(r)) {
                allCards.push({
                    id: Date.now() + Math.random() * 1000 + count,
                    groupId: 'default',
                    groupName: '默认分组',
                    content: r,
                    timestamp: Date.now()
                });
                existing.add(r);
                count++;
            }
        }
    } else {
        var items = Array.isArray(d) ? d : [];
        for (var i = 0; i < items.length; i++) {
            var item = items[i];
            if (item.content && item.content.trim() && !existing.has(item.content.trim())) {
                allCards.push({
                    id: item.id || Date.now() + Math.random() * 1000 + count,
                    groupId: item.groupId || 'default',
                    groupName: item.groupName || '默认分组',
                    content: item.content.trim(),
                    timestamp: Date.now()
                });
                existing.add(item.content.trim());
                count++;
            }
        }
    }
    
    localStorage.setItem('wordcards', JSON.stringify(allCards));
    renderGroupList();
    showToast(count > 0 ? '✅ 成功导入' + count + '条字卡' : '没有新字卡可导入');
}

function getFull78Deck(){var m=[{name:'愚者',emoji:'🌟',meaning:'新的开始，冒险精神',icon:'🧳'},{name:'魔术师',emoji:'🎩',meaning:'创造力，技能，自信',icon:'🪄'},{name:'女祭司',emoji:'🌙',meaning:'直觉，内在智慧',icon:'📜'},{name:'皇后',emoji:'👑',meaning:'丰饶，美丽自然',icon:'🌾'},{name:'皇帝',emoji:'🏛️',meaning:'权威，稳定秩序',icon:'🗡️'},{name:'教皇',emoji:'📿',meaning:'信仰，精神指引',icon:'📖'},{name:'恋人',emoji:'💕',meaning:'爱情，重要选择',icon:'👫'},{name:'战车',emoji:'⚔️',meaning:'胜利，勇往直前',icon:'🐴'},{name:'力量',emoji:'🦁',meaning:'勇气，内在力量',icon:'💪'},{name:'隐者',emoji:'🏔️',meaning:'内省，寻求真理',icon:'🕯️'},{name:'命运之轮',emoji:'🎡',meaning:'命运转折',icon:'🎰'},{name:'正义',emoji:'⚖️',meaning:'公平，因果',icon:'🏛️'},{name:'倒吊人',emoji:'🙃',meaning:'换个角度',icon:'🪢'},{name:'死神',emoji:'🦋',meaning:'结束即新生',icon:'💀'},{name:'节制',emoji:'🌊',meaning:'平衡调和',icon:'🏺'},{name:'恶魔',emoji:'🔗',meaning:'挣脱枷锁',icon:'😈'},{name:'高塔',emoji:'⚡',meaning:'突变启示',icon:'🗼'},{name:'星星',emoji:'⭐',meaning:'希望治愈',icon:'🌟'},{name:'月亮',emoji:'🌑',meaning:'潜意识',icon:'🌙'},{name:'太阳',emoji:'☀️',meaning:'快乐成功',icon:'🌻'},{name:'审判',emoji:'📯',meaning:'重生觉醒',icon:'👼'},{name:'世界',emoji:'🌍',meaning:'圆满成就',icon:'🏆'}];var s=['权杖','圣杯','宝剑','星币'];var r=['王牌','二','三','四','五','六','七','八','九','十','侍从','骑士','王后','国王'];var ic={权杖:'🪵',圣杯:'🍷',宝剑:'🗡️',星币:'🪙'};var mn=[];s.forEach(function(st){r.forEach(function(rk){mn.push({name:st+rk,emoji:ic[st],meaning:st+'的'+rk,icon:ic[st]});});});return m.concat(mn);}
async function drawTarot(){const btn=document.getElementById('drawBtn');btn.disabled=true;btn.textContent='🌟 洗牌中...';await new Promise(r=>setTimeout(r,1500));const deck=getFull78Deck();const cards=[];const used=new Set();while(cards.length<selectedSpread){const idx=Math.floor(Math.random()*deck.length);if(!used.has(idx)){used.add(idx);cards.push({...deck[idx],reversed:Math.random()<0.2});}}document.getElementById('tarotResult').style.display='block';const row=document.getElementById('tarotCardsRow');row.innerHTML='';const pos=selectedSpread===1?['指引']:['过去','现在','未来'];cards.forEach((c,i)=>{const ce=document.createElement('div');ce.style.cssText='width:95px;height:150px;border-radius:12px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform 0.6s;';ce.innerHTML='<div style="position:absolute;top:0;left:0;right:0;bottom:0;border-radius:12px;backface-visibility:hidden;background:linear-gradient(135deg,#1a0050,#2d0070);border:2px solid rgba(180,140,255,0.4);display:flex;align-items:center;justify-content:center;"><div style="width:70px;height:110px;border:3px double rgba(200,170,255,0.7);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;"><div style="position:absolute;top:4px;left:4px;right:4px;bottom:4px;border:1px solid rgba(200,170,255,0.4);border-radius:5px;"></div><div style="width:36px;height:36px;border:2px solid rgba(200,170,255,0.6);border-radius:50%;display:flex;align-items:center;justify-content:center;"><span style="font-size:20px;color:rgba(200,170,255,0.8);">★</span></div></div></div><div style="position:absolute;top:0;left:0;right:0;bottom:0;border-radius:12px;backface-visibility:hidden;background:#f8f0ff;border:2px solid rgba(160,120,220,0.5);transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;"><span style="font-size:22px;">'+(c.icon||c.emoji)+'</span><span style="font-size:10px;font-weight:700;color:#4a1a80;">'+c.name+(c.reversed?'(逆)':'')+'</span><span style="font-size:8px;color:#7050a0;">'+(c.reversed?'逆位：需反思':c.meaning)+'</span><span style="font-size:8px;color:#a080c0;">'+pos[i]+'</span></div>';ce.onclick=function(){this.style.transform=this.style.transform==='rotateY(180deg)'?'':'rotateY(180deg)';};row.appendChild(ce);setTimeout(()=>ce.style.transform='rotateY(180deg)',600+i*500);});document.getElementById('tarotReading').innerHTML='<p style="color:#d0a0ff;">📖 解读</p><p>'+cards.map((c,i)=>pos[i]+'：'+c.name+(c.reversed?'（逆位）':'')+' - '+(c.reversed?'需反思调整':c.meaning)).join('<br>')+'</p>';btn.disabled=false;btn.textContent='🌟 重新占卜';}

async function renderDataManage(){const msgs=await dbGetAll('messages');const cards=await dbGetAll('wordcards');const emojis=await dbGetAll('emojis');const logs=await dbGetAll('callLogs');const total=JSON.stringify({msgs,cards,emojis,logs});const kb=(new Blob([total]).size/1024).toFixed(1);let html='<div style="padding:16px;display:flex;flex-direction:column;align-items:center;background:#f8f5f0;min-height:100vh;"><div style="width:100%;max-width:400px;"><div style="background:#fff;border-radius:16px;padding:16px 18px;border:1px solid #f0ece8;margin-bottom:14px;"><div style="font-size:15px;font-weight:500;color:#333;margin-bottom:10px;">📊 存储用量</div><div style="display:flex;flex-direction:column;gap:4px;"><div style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:#555;"><span>聊天消息</span><span style="color:#333;font-weight:500;">'+msgs.length+' 条</span></div><div style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:#555;"><span>字卡数量</span><span style="color:#333;font-weight:500;">'+cards.filter(c=>c.content!=='__GROUP_PLACEHOLDER__').length+' 条</span></div><div style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:#555;"><span>表情包</span><span style="color:#333;font-weight:500;">'+emojis.length+' 个</span></div><div style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:#555;"><span>通话记录</span><span style="color:#333;font-weight:500;">'+logs.length+' 条</span></div><div style="display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:#555;border-top:1px solid #f0ece8;padding-top:8px;margin-top:4px;"><span>总用量</span><span style="color:#333;font-weight:600;">'+kb+' KB</span></div></div></div><div style="display:flex;flex-direction:column;gap:10px;"><button onclick="exportChat()" style="padding:12px 16px;border-radius:12px;background:#fff;border:1px solid #f0ece8;color:#333;font-size:14px;cursor:pointer;transition:all 0.2s;text-align:center;" onmouseover="this.style.background=\'#f8f5f0\'" onmouseout="this.style.background=\'#fff\'">📤 导出聊天记录</button><button onclick="document.getElementById(\'importFileInput\').click()" style="padding:12px 16px;border-radius:12px;background:#fff;border:1px solid #f0ece8;color:#333;font-size:14px;cursor:pointer;transition:all 0.2s;text-align:center;" onmouseover="this.style.background=\'#f8f5f0\'" onmouseout="this.style.background=\'#fff\'">📥 导入数据</button><button onclick="exportAll()" style="padding:12px 16px;border-radius:12px;background:#fff;border:1px solid #f0ece8;color:#333;font-size:14px;cursor:pointer;transition:all 0.2s;text-align:center;" onmouseover="this.style.background=\'#f8f5f0\'" onmouseout="this.style.background=\'#fff\'">💾 全量备份</button><button onclick="if(confirm(\'确定清除聊天记录？\'))clearChat()" style="padding:12px 16px;border-radius:12px;background:#fff;border:1px solid #f0ece8;color:#d4a8b8;font-size:14px;cursor:pointer;transition:all 0.2s;text-align:center;" onmouseover="this.style.background=\'#f8f5f0\'" onmouseout="this.style.background=\'#fff\'">🗑 清空聊天记录</button></div></div></div>';document.getElementById('dataManageContent').innerHTML=html;}
async function exportChat(){const msgs=await dbGetAll('messages');msgs.sort((a,b)=>a.timestamp-b.timestamp);let t='秦彻和笑笑的时光树洞\n'+'='.repeat(30)+'\n\n';msgs.forEach(m=>{const s=m.sender==='me'?S.myName:S.contactName;const c=m.type==='text'?m.content:(m.type==='emoji'?'[表情]':(m.type==='pat'?'[拍一拍]':'[图片]'));t+='['+new Date(m.timestamp).toLocaleString('zh-CN')+'] '+s+': '+c+'\n';});downloadBlob(t,'聊天记录.txt');}
async function exportAll(){try{const messages=await dbGetAll('messages');const settings=await dbGetAll('settings');const wordcards=await dbGetAll('wordcards');const emojis=await dbGetAll('emojis');const avatars=await dbGetAll('avatars');const callLogs=await dbGetAll('callLogs');const patOptions=await dbGetAll('patOptions');const statusOptions=await dbGetAll('statusOptions');const disabledCards=await dbGetAll('disabledCards');const disabledGroups=await dbGetAll('disabledGroups');const avatarHistory=await dbGetAll('avatarHistory');const totalCount=messages.length+wordcards.length+emojis.length+callLogs.length;if(totalCount===0){showToast('⚠️ 没有数据可导出，请先发送几条消息再试');return;}const data={messages,settings,wordcards,emojis,avatars,callLogs,patOptions,statusOptions,disabledCards,disabledGroups,avatarHistory,exportTime:new Date().toISOString(),totalCount};downloadBlob(JSON.stringify(data,null,2),'时光树洞_'+new Date().toLocaleDateString().replace(/\//g,'-')+'.json');showToast('✅ 导出成功！共 '+totalCount+' 条数据');}catch(e){console.error('导出失败:',e);showToast('❌ 导出失败：'+e.message);}}
async function importAllData(event){const f=event.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.messages&&d.appName==='ChatApp'&&d.exportModules&&d.exportModules.includes('messages')){var chatCount=0;for(var msg of d.messages){await dbPut('messages',{sender:msg.sender==='user'?'me':'other',content:msg.text||'',type:msg.type==='sticker'?'emoji':'text',timestamp:new Date(msg.timestamp).getTime()||Date.now()});chatCount++;}showToast('✅ 成功导入'+chatCount+'条聊天记录！');event.target.value='';return;}if(!d.messages&&!d.settings){showToast('无效文件');event.target.value='';return;}if(!confirm('导入将覆盖当前数据，确定？')){event.target.value='';return;}const stores=['messages','settings','wordcards','emojis','avatars','callLogs','patOptions','statusOptions','disabledCards','disabledGroups','avatarHistory'];for(let s of stores)await dbClear(s);if(d.messages)for(let m of d.messages)await dbPut('messages',m);if(d.settings)for(let s of d.settings)await dbPut('settings',s);if(d.wordcards)for(let w of d.wordcards)await dbPut('wordcards',w);if(d.emojis)for(let e of d.emojis)await dbPut('emojis',e);if(d.avatars)for(let a of d.avatars)await dbPut('avatars',a);if(d.callLogs)for(let l of d.callLogs)await dbPut('callLogs',l);if(d.patOptions)for(let p of d.patOptions)await dbPut('patOptions',p);if(d.statusOptions)for(let so of d.statusOptions)await dbPut('statusOptions',so);if(d.disabledCards)for(let dc of d.disabledCards)await dbPut('disabledCards',dc);if(d.disabledGroups)for(let dg of d.disabledGroups)await dbPut('disabledGroups',dg);if(d.avatarHistory)for(let ah of d.avatarHistory)await dbPut('avatarHistory',ah);const allS=await dbGetAll('settings');allS.forEach(x=>{if(x.key in S)S[x.key]=x.value;else if(x.key==='chatSettings'){try{S.chatSettings=JSON.parse(x.value);}catch(e){}}});const allA=await dbGetAll('avatars');allA.forEach(x=>{if(x.key==='myAvatar')S.myAvatar=x.data;if(x.key==='contactAvatar')S.contactAvatar=x.data;});const allP=await dbGetAll('patOptions');if(allP.length>0)patOptions=allP.map(x=>x.content);updateHome();applyBubbleStyle();showToast('导入成功');}catch(e){showToast('导入失败：'+e.message);}event.target.value='';}
async function clearChat(){await dbClear('messages');showToast('已清空');}
