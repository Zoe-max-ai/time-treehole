<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>秦彻和笑笑的时光树洞 2.0</title>
    <style>
        :root{--primary:#ff6b81;--bg:#f8f8f8;--text:#333;--text-light:#999;--text-lighter:#bbb;--border:#f0f0f0;--shadow:0 2px 12px rgba(0,0,0,0.06);--radius:16px;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f0f0f0;color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;}
        @supports(padding-top:env(safe-area-inset-top)){body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}}
        .page{display:none;flex-direction:column;height:100%;overflow:hidden;background:#f8f8f8;}
        .page.active{display:flex;}
        .navbar{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);flex-shrink:0;position:relative;min-height:48px;}
        .navbar .back-btn{position:absolute;left:16px;width:36px;height:36px;border-radius:50%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;border:none;color:var(--text);z-index:1;}
        .navbar .title{font-size:17px;font-weight:600;}
        .home-page-inner{background:#fff5f7;display:flex;flex-direction:column;height:100%;}
        .home-top-area{text-align:center;padding:80px 20px 8px;flex-shrink:0;}
        .home-avatar-group{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
        .home-avatar-img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,0.1);}
        .home-avatar-name{font-size:11px;font-weight:600;margin-top:4px;}
        .home-heart{font-size:20px;color:var(--primary);animation:heartBeat 1.5s infinite;}
        @keyframes heartBeat{0%,100%{transform:scale(1);}25%{transform:scale(1.15);}50%{transform:scale(1);}75%{transform:scale(1.1);}}
        .home-status-tag{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;border-radius:18px;font-size:12px;margin-top:4px;background:#f0f9f0;color:#4a8a4a;border:1px solid #d0e8d0;}
        .home-status-dot{width:6px;height:6px;border-radius:50%;background:#4cd964;}
        .home-mood-preview{font-size:12px;color:var(--text-light);font-style:italic;margin-top:6px;}
        .home-divider{display:flex;align-items:center;padding:0 20px;margin-top:12px;margin-bottom:16px;flex-shrink:0;width:100%;}
        .home-divider .line{flex:1;height:1px;background:#ccc;}
        .home-divider .label{padding:0 12px;font-size:11px;color:#333;}
        .home-grid-scroll{flex:1;overflow-y:auto;padding:24px 14px 14px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;align-content:start;}
        .home-card{background:transparent;border-radius:0;padding:0;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:none;box-shadow:none;}
        .home-card:active{transform:scale(0.95);}
        .home-card .card-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.5);backdrop-filter:blur(2px);border:1px solid rgba(255,255,255,0.3);box-shadow:0 2px 8px rgba(0,0,0,0.02);}
        .home-card .card-icon svg{width:26px;height:26px;}
        .home-card .card-title{font-size:11px;font-weight:400;color:#333;margin-top:4px;}
        .home-footer{text-align:center;padding:8px;flex-shrink:0;font-size:9px;color:#ccc;}
        .chat-topbar{background:#fff;padding:8px 12px;display:flex;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0;min-height:42px;gap:8px;}
        .chat-topbar .back-arrow{width:30px;height:30px;border-radius:50%;background:#f5f5f5;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;border:none;color:var(--text);flex-shrink:0;}
        .chat-topbar .romantic-quote{flex:1;text-align:center;font-size:12px;color:#c0a0c0;font-style:italic;cursor:pointer;}
        .chat-topbar .chat-settings-cat{font-size:20px;cursor:pointer;flex-shrink:0;padding:2px 4px;}
        .chat-area{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:12px;background:#f8f8f8;background-size:cover;background-position:center;background-repeat:no-repeat;}
        .system-msg{text-align:center;font-size:10px;color:var(--text-lighter);padding:3px 0;}
        .message-wrapper{display:flex;flex-direction:column;max-width:78%;}
        .message-wrapper.left{align-self:flex-start;}.message-wrapper.right{align-self:flex-end;align-items:flex-end;}
        .message-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;margin-bottom:3px;cursor:pointer;}
        .bubble{padding:9px 14px 9px 12px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word;position:relative;}
        .message-wrapper.left .bubble{background:#fff;color:#333;border-bottom-left-radius:4px;}
        .message-wrapper.right .bubble{background:#ffe0e6;color:#333;border-bottom-right-radius:4px;}
        .read-check{position:absolute;bottom:1px;right:3px;font-size:9px;color:#c0b0b0;opacity:0.6;line-height:1;pointer-events:none;}
        .message-time{font-size:9px;color:var(--text-lighter);margin-top:1px;padding:0 3px;}
        .message-wrapper.left .message-time{margin-left:32px;}
        .message-wrapper.right .message-time{text-align:right;margin-right:2px;}
        .pat-bubble{background:#fff9e6!important;color:#8a7a4a!important;font-style:italic;font-size:13px!important;}
        .typing-indicator{font-size:11px;color:var(--text-lighter);padding:4px 12px;font-style:italic;animation:blink 1.5s infinite;}
        @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.4;}}
        .bottombar{background:rgba(255,255,255,0.98);padding:8px 10px;display:flex;align-items:center;gap:5px;border-top:1px solid var(--border);flex-shrink:0;min-height:48px;position:sticky;bottom:0;}
        @supports(padding-bottom:env(safe-area-inset-bottom)){.bottombar{padding-bottom:calc(8px + env(safe-area-inset-bottom));}}
        .bottombar .icon-btn{width:34px;height:34px;border-radius:10px;background:#f8f8f8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;border:none;color:#666;transition:all .15s;flex-shrink:0;}
        .bottombar input{flex:1;border:1.5px solid transparent;border-radius:18px;padding:8px 12px;font-size:14px;outline:none;background:#f5f5f5;min-width:0;}
        .bottombar .send-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:15px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
        .emoji-panel{display:none;background:#fff;border-top:1px solid var(--border);flex-shrink:0;max-height:240px;flex-direction:column;}
        .emoji-panel.show{display:flex;}
        .emoji-panel .emoji-tabs{display:flex;border-bottom:1px solid #f0f0f0;flex-shrink:0;}
        .emoji-panel .emoji-tab{flex:1;padding:9px;text-align:center;font-size:12px;cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;color:var(--text-light);}
        .emoji-panel .emoji-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
        .emoji-panel .tab-content{overflow-y:auto;flex:1;padding:8px;}
        .pat-effect{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-size:14px;color:var(--primary);background:rgba(255,255,255,0.97);padding:10px 20px;border-radius:20px;z-index:999;pointer-events:none;animation:patBounce 1.6s ease forwards;}
        @keyframes patBounce{0%{opacity:0;transform:translate(-50%,-50%)scale(.3);}15%{opacity:1;transform:translate(-50%,-50%)scale(1.1);}60%{transform:translate(-50%,-50%)scale(.95);}85%{opacity:1;transform:translate(-50%,-50%)scale(1);}100%{opacity:0;transform:translate(-50%,-50%)scale(.8);}}
        .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.78);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;pointer-events:none;animation:toastInOut 2s ease;}
        @keyframes toastInOut{0%{opacity:0;transform:translate(-50%,-50%)scale(.85);}12%{opacity:1;transform:translate(-50%,-50%)scale(1.02);}80%{opacity:1;transform:translate(-50%,-50%)scale(1);}100%{opacity:0;transform:translate(-50%,-50%)scale(.9);}}
        input[type="file"]{display:none;}
        .generic-content{flex:1;overflow-y:auto;padding:12px;}
        .settings-section{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
        .settings-section h4{font-size:13px;color:var(--text-light);margin-bottom:8px;}
        .settings-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f8f8f8;}
        .avatar-row{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 0;}
        .small-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #f0f0f0;}
        .avatar-history-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
        .avatar-history-item{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid transparent;cursor:pointer;position:relative;}
        .avatar-history-item.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,129,0.2);}
        .avatar-history-item .ah-del{position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:#ff4757;border-radius:50%;color:#fff;font-size:8px;display:flex;align-items:center;justify-content:center;}
        .toggle-switch{width:44px;height:24px;border-radius:12px;background:#ddd;cursor:pointer;position:relative;transition:all .2s;flex-shrink:0;}
        .toggle-switch.on{background:var(--primary);}
        .toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:all .2s;}
        .toggle-switch.on::after{left:22px;}
        .call-fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;z-index:500;background:linear-gradient(180deg,#1a1a2e,#16213e,#0f3460);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;max-width:480px;margin:0 auto;}
        .call-fullscreen.show{display:flex;}
        .call-avatar-lg{width:100px;height:100px;border-radius:50%;object-fit:cover;margin-bottom:20px;border:3px solid rgba(255,255,255,0.3);}
        .call-avatar-lg.ringing{animation:callPulse 1.5s infinite;}
        @keyframes callPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,129,0.4);}50%{box-shadow:0 0 0 25px rgba(255,107,129,0);}}
        .call-float-ball{display:none;position:fixed;z-index:600;width:54px;height:54px;border-radius:50%;background:#1a1a2e;box-shadow:0 4px 20px rgba(0,0,0,0.35);cursor:pointer;align-items:center;justify-content:center;touch-action:none;right:16px;bottom:120px;}
        .call-float-ball.show{display:flex;}
        .call-float-ball .ball-end{position:absolute;top:-8px;right:-8px;background:#ff4757;color:#fff;width:20px;height:20px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
        .chat-settings-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:280;justify-content:center;align-items:flex-end;}
        .chat-settings-overlay.show{display:flex;}
        .chat-settings-panel{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;}
        .profile-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:250;justify-content:center;align-items:flex-end;}
        .profile-overlay.show{display:flex;}
        .profile-card{background:#fff;border-radius:22px 22px 0 0;padding:24px 18px;width:100%;max-width:480px;max-height:70vh;overflow-y:auto;text-align:center;}
        .emoji-manage-item{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;background:#fafafa;border:1px solid #f0f0f0;}
        .emoji-manage-item img{width:100%;height:100%;object-fit:cover;padding:4px;border-radius:8px;}
        .emoji-manage-item .del-overlay{position:absolute;top:3px;right:3px;width:18px;height:18px;background:rgba(255,71,87,0.9);border-radius:50%;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;}
        .wordcard-content{flex:1;overflow-y:auto;padding:12px;}
        .wordcard-top-bar{display:flex;gap:6px;margin-bottom:6px;}
        .wordcard-top-bar button{flex:1;padding:8px 6px;border-radius:14px;border:none;cursor:pointer;font-size:10px;font-weight:500;}
        .wordcard-search{width:100%;padding:8px 12px;border-radius:14px;border:1.5px solid #eee;font-size:12px;outline:none;margin-bottom:6px;}
        .wordcard-global-search{width:100%;padding:8px 12px;border-radius:14px;border:1.5px solid var(--primary);font-size:12px;outline:none;margin-bottom:8px;background:#fff5f7;}
        .wordcard-groups-section{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--shadow);}
        .group-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;cursor:pointer;border-bottom:1px solid #f8f8f8;}
        .add-group-row{display:flex;gap:6px;margin-top:8px;}
        .add-group-row input{flex:1;padding:8px 12px;border-radius:14px;border:1.5px solid #eee;font-size:12px;outline:none;}
        .add-group-row button{padding:8px 14px;border-radius:14px;background:var(--primary);color:#fff;border:none;font-size:12px;cursor:pointer;white-space:nowrap;}
        .wordcard-list-item{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:8px;border-bottom:1px solid #f5f5f5;font-size:13px;}
        .bubble-preset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}
        .bubble-preset-item{padding:10px 6px;border-radius:12px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s;font-size:11px;}
        .bubble-preset-item.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,129,0.15);}
        .mini-bubble{padding:6px 8px;border-radius:12px;font-size:10px;margin:3px 0;max-width:80%;}
        .mini-bubble.me{align-self:flex-end;border-bottom-right-radius:3px;margin-left:auto;}
        .mini-bubble.other{align-self:flex-start;border-bottom-left-radius:3px;}
        .batch-add-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:300;justify-content:center;align-items:center;}
        .batch-add-modal.show{display:flex;}
        .batch-add-modal .modal-content{background:#fff;border-radius:16px;padding:20px;width:90%;max-width:380px;max-height:80vh;display:flex;flex-direction:column;}
        .batch-add-modal textarea{flex:1;border:1.5px solid #eee;border-radius:12px;padding:12px;font-size:14px;resize:none;outline:none;min-height:120px;}
        .batch-add-modal select{width:100%;padding:10px;border-radius:12px;border:1.5px solid #eee;font-size:14px;outline:none;background:#fff;margin:8px 0;}
        .bg-preset-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
        .bg-preset-item{aspect-ratio:1;border-radius:10px;cursor:pointer;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:18px;}
        .bg-preset-item.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,129,0.2);}
        .emoji-group-tabs{display:flex;gap:6px;padding:6px 10px;flex-wrap:wrap;border-bottom:1px solid #f0f0f0;background:#fafafa;}
        .emoji-group-tab{padding:4px 12px;border-radius:12px;font-size:12px;cursor:pointer;border:none;background:transparent;color:#999;transition:all 0.2s;}
        .emoji-group-tab.active{background:var(--primary);color:#fff;}
        .emoji-group-tab.add{background:#f0f0f0;color:#666;font-size:14px;padding:4px 10px;}
/* ===== 乌鸦从门里飞出 ===== */
@keyframes crowFlyIn {
    0% { 
        transform: translateY(20px) scale(0.3); 
        opacity: 0; 
    }
    60% { 
        transform: translateY(-5px) scale(1.1); 
        opacity: 1; 
    }
    100% { 
        transform: translateY(0px) scale(1); 
        opacity: 1; 
    }
}

/* 翅膀扇动 */
@keyframes wingFlap {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
}

@keyframes wingFlapReverse {
    0%, 100% { transform: rotate(5deg); }
    50% { transform: rotate(-5deg); }
}

/* 纸条滑落动画 */
@keyframes paperSlideDown {
    0% { transform: translateY(-30px) scale(0.9); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
}

/* ===== SVG 乌鸦 ===== */
.crow-svg {
    width: 100px;
    height: 80px;
    animation: crowFlyIn 0.8s ease-out forwards;
}

/* ===== 简约门 ===== */
.door {
    display: inline-block;
    position: relative;
    width: 80px;
    height: 120px;
    background: #d4c8b0;
    border: 3px solid #8a7a6a;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    transition: transform 0.8s ease;
    transform-origin: left center;
}

.door-closed {
    transform: perspective(600px) rotateY(0deg);
}

.door-open {
    transform: perspective(600px) rotateY(-35deg);
}

.door-handle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 8px;
    height: 8px;
    background: #b8860b;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

/* 门框 */
.door-frame {
    display: inline-block;
    padding: 4px;
    background: #8a7a6a;
    border-radius: 8px;
}

/* ===== 清爽纸条 ===== */
.paper {
    background: #f7f0e6;
    padding: 18px 24px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    border: 1.5px solid #e0d4c0;
    font-family: cursive;
    font-size: 17px;
    color: #4a3a2a;
    text-align: center;
    max-width: 260px;
    margin: 0 auto;
    animation: paperSlideDown 0.6s ease-out;
    position: relative;
    line-height: 1.7;
    letter-spacing: 0.3px;
}

.paper::before,
.paper::after {
    display: none;
}

.paper-rough {
    border-radius: 12px;
    clip-path: none;
}
/* ===== 强制乌鸦飞行动画 ===== */
@keyframes crowFlyUp {
    0% { 
        transform: translateY(-30px) scale(0.3); 
        opacity: 0; 
    }
    50% { 
        transform: translateY(5px) scale(1.1); 
        opacity: 1; 
    }
    100% { 
        transform: translateY(0px) scale(1); 
        opacity: 1; 
    }
}

@keyframes wingFlapFast {
    0%, 100% { transform: rotate(-20deg); }
    50% { transform: rotate(20deg); }
}

@keyframes wingFlapFastReverse {
    0%, 100% { transform: rotate(20deg); }
    50% { transform: rotate(-20deg); }
}

.crow-svg {
    width: 100px;
    height: 80px;
}

.crow-fly {
    animation: crowFlyUp 0.9s ease-out forwards !important;
}

.wing-left {
    transform-origin: 55px 45px !important;
    animation: wingFlapFast 0.15s ease-in-out infinite alternate !important;
}

.wing-right {
    transform-origin: 70px 42px !important;
    animation: wingFlapFastReverse 0.15s ease-in-out infinite alternate !important;
}

body.light-text .home-avatar-name,
body.light-text .home-status-tag,
body.light-text .home-mood-preview,
body.light-text .home-divider .label,
body.light-text .home-card .card-title,
body.light-text .home-footer {
    color: #fff !important;
}
body.light-text .home-status-tag {
    background: rgba(255,255,255,0.15) !important;
    border-color: rgba(255,255,255,0.3) !important;
}
body.light-text .home-divider .line {
    background: rgba(255,255,255,0.5) !important;
}
body.light-text .home-card .card-icon {
    background: rgba(255,255,255,0.2) !important;
    border-color: rgba(255,255,255,0.4) !important;
}
body.light-text .home-card .card-icon svg {
    stroke: #fff !important;
}
body.light-text .home-footer {
    color: rgba(255,255,255,0.6) !important;
    font-size: 9px !important;
    text-align: center !important;
}
body.light-text #themeToggleBtn {
    color: #fff !important;
}

/* 私密锁 */
#lockInputPanel {
    position: fixed;
    bottom: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    background: rgba(255,255,255,0.95);
    border-radius: 16px;
    padding: 16px;
    z-index: 99999;
    transition: bottom 0.3s ease;
    box-shadow: 0 -4px 30px rgba(0,0,0,0.1);
}
#lockInputPanel.show {
    bottom: 40px;
}
#lockInputPanel input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1.5px solid #e8e0d8;
    font-size: 18px;
    text-align: center;

/* 模块卡片 */
.module-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 4px 12px rgba(90, 74, 58, 0.04);
}

/* 模块标题 */
.module-title {
    font-size: 13px;
    color: #a0a0a0;
    margin-bottom: 12px;
    font-weight: 500;
}

/* 选项列表 */
.module-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* 自定义复选框容器 */
.module-checkbox-label {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 14px;
    color: #5a4a3a;
}

/* 隐藏原生 checkbox */
.module-checkbox-label input[type="checkbox"] {
    display: none;
}

/* 自定义 checkbox 外观 */
.module-checkbox-custom {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid #e0d5c8;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

/* 选中态 */
.module-checkbox-label input[type="checkbox"]:checked + .module-checkbox-custom {
    background: #d4a8b8;
    border-color: #d4a8b8;
}

.module-checkbox-label input[type="checkbox"]:checked + .module-checkbox-custom::after {
    content: '✔';
    color: #fff;
    font-size: 12px;
    font-weight: bold;
}

/* 下拉框 */
.module-select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1.5px solid #e8e0d8;
    background: #fffaf5;
    font-size: 14px;
    color: #5a4a3a;
    margin-bottom: 12px;
}

/* 保存按钮 */
.module-save-btn {
    margin-top: 10px;
    width: 100%;
    padding: 10px 16px;
    border-radius: 12px;
    background: #fdf5f7;
    color: #d4a8b8;
    border: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
}

/* ========== 通话全屏页 ========== */
#callFullscreen {
    background: #f8f5f0;
}

#callFullscreen .call-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: #ffffff;
    border-radius: 24px;
    margin: 60px auto 0;
    width: 320px;

    width: 96px;

    box-shadow: 0 4px 12px rgba(212, 168, 184, 0.2);
}

/* 名字 */

    margin-top: 16px;
    font-size: 20px;
    font-weight: 600;
    color: #5a4a3a;
}

    margin-top: 6px;
    font-size: 14px;
    color: #a0a0a0;
}

/* 计时器 */

    margin-top: 12px;
    font-size: 22px;
    font-weight: 500;
    color: #d4a8b8;
    letter-spacing: 1px;

    height: 56px;
    border-radius: 50%;
    border: none;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

/* 接听按钮 */

/* 响铃动画（柔和版） */

@keyframes ringSoft {
    0% { box-shadow: 0 0 0 0 rgba(212,168,184,0.3); }

    100% { box-shadow: 0 0 0 0 rgba(212,168,184,0); }

// 星币
function tarotCoin(cx,cy,r){
  const a=[];
  for(let i=0;i<5;i++){const ang=-Math.PI/2+i*Math.PI*2/5;a.push([cx+r*Math.cos(ang),cy+r*Math.sin(ang)]);}
  return `<circle cx="${cx}" cy="${cy}" r="${r}"/><path d="M${a[0][0].toFixed(1)} ${a[0][1].toFixed(1)} L${a[2][0].toFixed(1)} ${a[2][1].toFixed(1)} L${a[4][0].toFixed(1)} ${a[4][1].toFixed(1)} L${a[1][0].toFixed(1)} ${a[1][1].toFixed(1)} L${a[3][0].toFixed(1)} ${a[3][1].toFixed(1)} Z" stroke-width="1.7"/>`;
}
function tarotCoinsGroup(n,x0,x1,cy,r){
  let s="";if(n===1){return tarotCoin((x0+x1)/2,cy,r);}
  for(let i=0;i<n;i++){const x=Math.round(x0+(x1-x0)*i/(n-1));s+=tarotCoin(x,cy,r);}
  return s;
}

// ============ IndexedDB 存储层 ============
const DB_NAME = 'TimeTreeDB';
const DB_VERSION = 5;
let db = null;

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
            const d = e.target.result;
            ['messages','settings','wordcards','emojis','avatars','callLogs','patOptions','statusOptions','disabledCards','disabledGroups','avatarHistory','bgSettings','boardMessages','wishes','anniversaries','answerBookHistory','choiceHistory','tarotMessages','tarotHistory','calendarSettings'].forEach(s => {
                if(!d.objectStoreNames.contains(s)) d.createObjectStore(s, {keyPath:'id', autoIncrement:true});
            });
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = (e) => reject(e.target.error);
    });
}

async function idbPut(store, data) {
    if(!db) await openDB();
    return new Promise((resolve, reject) => {
        if(!data.id && !data.key) data.id = Date.now() + Math.random()*1000;
        const tx = db.transaction(store, 'readwrite');
        const st = tx.objectStore(store);
        if((store==='settings'||store==='bgSettings') && data.key) {
            const gr = st.get(data.key);
            gr.onsuccess = () => { data.id = gr.result ? gr.result.id : data.key; const pr = st.put(data); pr.onsuccess = () => resolve(data.key||data.id); pr.onerror = (e) => reject(e.target.error); };
            gr.onerror = (e) => reject(e.target.error);
            return;
        }
        const req = st.put(data);
        req.onsuccess = () => resolve(data.id || req.result);
        req.onerror = (e) => reject(e.target.error);
    });
}

async function idbGetAll(store) {
    if(!db) await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => resolve(req.result||[]);
        req.onerror = (e) => reject(e.target.error);
    });
}

async function idbDelete(store, id) {
    if(!db) await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e.target.error);
    });
}

async function idbClear(store) {
    if(!db) await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).clear();
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e.target.error);
    });
}

// 兼容层
async function dbPut(s,d) { return idbPut(s,d); }
async function dbGetAll(s) { return idbGetAll(s); }
async function dbClear(s) { return idbClear(s); }
async function dbDelete(s,id) { return idbDelete(s,id); }
async function getCal(k, def = null) {
    const all = await idbGetAll('calendarSettings');
    const matches = all.filter(x => x.key === k);
    if (matches.length === 0) return def;
    matches.sort((a, b) => b.timestamp - a.timestamp);
    return matches[0].value;
}
async function setCal(k,v) { await idbPut('calendarSettings', {key:k, value:v, timestamp:Date.now()}); }

// 迁移
async function migrateFromLocalStorage() {
    const mk = '__migrated_to_idb_v2';
    const existing = await idbGetAll('settings');
    if(existing.some(x=>x.key===mk)) { console.log('已迁移'); return; }
    let hasData = false;
    for(const k of ['messages','settings','wordcards','emojis','avatars','callLogs','patOptions','statusOptions','disabledCards','disabledGroups','avatarHistory','bgSettings','wishes','anniversaries','answerBookHistory','choiceHistory','tarotMessages','boardMessages']) {
        try { if(localStorage.getItem(k)) { hasData=true; break; } } catch(e){}
    }
    if(!hasData) {
        for(const k of ['emojiGroups','chatGroups','mailboxGroups','tarotGroup','answerBookGroup','contactMood','myName','contactName']) {
            if(localStorage.getItem(k)) { hasData=true; break; }
        }
    }
    if(!hasData) { await idbPut('settings',{key:mk,value:Date.now()}); return; }
    console.log('🔄 迁移中...');
    for(const s of ['messages','settings','wordcards','emojis','avatars','callLogs','patOptions','statusOptions','disabledCards','disabledGroups','avatarHistory','bgSettings','wishes','anniversaries','answerBookHistory','choiceHistory','tarotMessages','boardMessages']) {
        try {
            const d = JSON.parse(localStorage.getItem(s)||'[]');
            if(Array.isArray(d)) for(const item of d) { if(item) await idbPut(s, item); }
        } catch(e){}
    }
    for(const k of ['emojiGroups','chatGroups','mailboxGroups','tarotGroup','answerBookGroup','contactMood','myName','contactName']) {
        const v = localStorage.getItem(k);
        if(v) await setCal(k, v);
    }
    await idbPut('settings',{key:mk,value:Date.now()});
    localStorage.clear();
    console.log('✅ 迁移完成');
    showToast('🎉 2.0 升级完成！数据已自动迁移');
}

function doDeliverReply(roleKey, userOptions) {
    var shouldPick = Math.random() < 0.6;
    var tails = ['选是选了，但这些选项概括不了我。','姑且选这个，别靠题目揣测我。','答案勾好了，想知道真心话直接问我。','就这个，纸上写不出全部。','按你的规则选了，我更愿意用行动说明。'];
    var declines = ['我不想选，这里没有合适答案。','不做，我不喜欢被限定答案。','没必要选，心意不是勾选就能说清。','拒绝作答，想问就直接开口。','没兴趣做测验，这些选择不适合我们。'];
    if (shouldPick && userOptions && userOptions.length > 0) {
        var chosen = userOptions[Math.floor(Math.random() * userOptions.length)];
        return chosen + tails[Math.floor(Math.random() * tails.length)];
    }
    return declines[Math.floor(Math.random() * declines.length)];
}

var chatLoadCount = 100; // 每次加载数量

async function loadMessages() {
    const msgs = await dbGetAll('messages');
    msgs.sort((a,b) => a.timestamp - b.timestamp);

    ca.innerHTML = '';
    
    if (msgs.length === 0) {
        ca.innerHTML = '<div style="text-align:center;color:#ccc;padding:40px;">💬 开始你们的对话吧</div>';
        return;

    // 只取最后100条

    // 如果还有更早的消息，顶部加"加载更多"按钮

        var moreBtn = document.createElement('div');

// ============ 私密锁 ============
var lockState = {
    unlocked: false,
    password: null,
    changingPassword: false
};

function initLock() {
    var footer = document.getElementById('homeFooter');
    if (!footer) return;

    var savedPass = sessionStorage.getItem('lockPassword');
    var savedState = sessionStorage.getItem('lockUnlocked');
    if (savedPass) lockState.password = savedPass;
    if (savedState === 'true') lockState.unlocked = true;

    var clickCount = 0;
    var clickTimer = null;
    footer.addEventListener('click', function() {
        clickCount++;
        if (clickCount === 1) {
            clickTimer = setTimeout(function() { clickCount = 0; }, 500);
        }
        if (clickCount >= 3) {
            clickCount = 0;
            clearTimeout(clickTimer);
            showLockPanel();
        }
    });

    var pressTimer = null;
    footer.addEventListener('touchstart', function() {
        pressTimer = setTimeout(function() {
            lockNow();
        }, 2000);
    });
    footer.addEventListener('touchend', function() { clearTimeout(pressTimer); });
    footer.addEventListener('touchmove', function() { clearTimeout(pressTimer); });

    var input = document.getElementById('lockPasswordInput');
    if (input) {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitLockPassword();
        });
    }
}

function showLockPanel() {
    var panel = document.getElementById('lockInputPanel');
    if (!panel) return;
    panel.classList.add('show');
    var input = document.getElementById('lockPasswordInput');
    if (input) {
        input.value = '';
        if (!lockState.password) {
            input.placeholder = '设置6位通行令';
        } else if (lockState.unlocked) {
            input.placeholder = '输入旧通行令';
            lockState.changingPassword = true;
        } else {
            input.placeholder = '输入通行令';
        }
        setTimeout(function() { input.focus(); }, 300);
    }
}

function hideLockPanel() {
    var panel = document.getElementById('lockInputPanel');
    if (panel) panel.classList.remove('show');
}

function submitLockPassword() {
    var input = document.getElementById('lockPasswordInput');
    if (!input) return;
    var val = input.value.trim();

    if (!lockState.password) {
        if (val.length !== 6 || !/^\d{6}$/.test(val)) { shakeLockPanel(); return; }
        lockState.password = val;
        sessionStorage.setItem('lockPassword', val);
        lockState.unlocked = true;
        sessionStorage.setItem('lockUnlocked', 'true');
        hideLockPanel();
        return;
    }

    if (lockState.unlocked && lockState.changingPassword) {
        if (val === lockState.password) {
            lockState.changingPassword = false;
            lockState.password = null;
            sessionStorage.removeItem('lockPassword');
            input.value = '';
            input.placeholder = '设置新通行令';
            showToast('✅ 旧通行令正确，请输入新通行令');
        } else {
            shakeLockPanel();
        }
        return;
    }

    if (val === lockState.password) {
        lockState.unlocked = true;
        sessionStorage.setItem('lockUnlocked', 'true');
        hideLockPanel();
    } else {
        shakeLockPanel();
    }
}

function shakeLockPanel() {
    var panel = document.getElementById('lockInputPanel');
    if (!panel) return;
    panel.classList.add('shake');
    setTimeout(function() { panel.classList.remove('shake'); }, 300);
}

function lockNow() {
    lockState.unlocked = false;
    sessionStorage.setItem('lockUnlocked', 'false');
    var footer = document.getElementById('homeFooter');
    if (footer) {
        footer.classList.add('lock-shrink');
        setTimeout(function() { footer.classList.remove('lock-shrink'); }, 120);
    }
    if (navigator.vibrate) { navigator.vibrate(50); }
}

function isLocked() {
    return !lockState.unlocked;
}

function checkLock(card, fn) {
    if (isLocked()) {
        card.classList.add('lock-denied');
        setTimeout(function() { card.classList.remove('lock-denied'); }, 300);
        return;
    }
    fn();
}

// ============ 消息菜单 ============
function showMessageMenu(m, bubble, e) {
    var oldMenu = document.getElementById('msgContextMenu');
    if (oldMenu) oldMenu.remove();

    var menu = document.createElement('div');
    menu.id = 'msgContextMenu';
    menu.style.cssText = 'position:fixed;z-index:99999;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.2);padding:6px 0;min-width:120px;';

    var withinTwoMin = (Date.now() - m.timestamp) < 120000;
    var items;
    if (m.sender === 'me' && withinTwoMin) {
        items = [
            { label: '📋 复制', action: 'copy' },
            { label: '💬 收藏', action: 'collect' },
            { label: '↩️ 撤回', action: 'recall' }
        ];
    } else {
        items = [
            { label: '📋 复制', action: 'copy' },
            { label: '💬 收藏', action: 'collect' },
            { label: '🗑 删除', action: 'delete' }
        ];
    }

    items.forEach(function(item) {
        var div = document.createElement('div');
        div.textContent = item.label;
        div.style.cssText = 'padding:10px 16px;font-size:14px;cursor:pointer;color:#333;';
        div.onmouseover = function() { this.style.background = '#f5f5f5'; };
        div.onmouseout = function() { this.style.background = 'transparent'; };
        div.onclick = function() {
            if (item.action === 'copy') {
                navigator.clipboard.writeText(m.content).then(function() {
                    showToast('✅ 已复制');
                }).catch(function() {
                    showToast('❌ 复制失败');
                });
            } else if (item.action === 'collect') {
                var collected = JSON.parse(localStorage.getItem('collectedMessages') || '[]');
                collected.push({
                    id: Date.now(),
                    sender: m.sender,
                    content: m.type === 'pat' ? '👋 ' + m.content : m.content,
                    time: fmtTime(m.timestamp),
                    timestamp: m.timestamp,
                    collectedBy: 'me'
                });
                localStorage.setItem('collectedMessages', JSON.stringify(collected));
                showToast('✅ 已收藏到许愿页');
            } else if (item.action === 'recall') {
                if (confirm('撤回这条消息？')) {
                    navigator.clipboard.writeText(m.content).then(function() {
                        deleteMessage(m.id);
                    }).catch(function() {
                        deleteMessage(m.id);
                    });
                }
            } else if (item.action === 'delete') {
                if (confirm('确定删除这条消息？')) {
                    deleteMessage(m.id);
                }
            }
            menu.remove();
        };
        menu.appendChild(div);
    });

    var x = e.clientX || window.innerWidth / 2;
    var y = e.clientY || window.innerHeight / 2;
    menu.style.left = Math.min(x, window.innerWidth - 140) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - 150) + 'px';

    document.body.appendChild(menu);

    document.addEventListener('click', function closeMenu(ev) {
        if (!menu.contains(ev.target)) {
            menu.remove();
            document.removeEventListener('click', closeMenu);
        }
    });
}

async function deleteMessage(msgId) {
    var msgs = await dbGetAll('messages');
    msgs = msgs.filter(function(x) { return String(x.id) !== String(msgId); });
    await dbClear('messages');
    for (var i = 0; i < msgs.length; i++) {
        await dbPut('messages', msgs[i]);

    loadMessages();
    showToast('🗑 已删除');
}

async function autoReply(){
    const cs = S.chatSettings;
    
    if (cs.readReceipt !== 'none') {
        setTimeout(() => {
            if (cs.readReceipt === 'graphic') {
                var myMsgs = document.querySelectorAll('.message-wrapper.right .bubble');
                if (myMsgs.length > 0) {
                    var lastBubble = myMsgs[myMsgs.length - 1];
                    if (!lastBubble.querySelector('.read-check')) {
                        var ck = document.createElement('span');
                        ck.className = 'read-check';
                        ck.textContent = '✓';
                        lastBubble.appendChild(ck);
                    }
                }
            } else {
                addSysMsg('📖 秦彻已读');
            }
        }, 800 + Math.random() * 1200);
    }
    
 if (cs.readNotReply) {
    var roll = Math.random();
    var noReplyProb = (cs.readNotReplyProb || 50) / 100;
    if (roll < noReplyProb) {
        // 不回复，不显示任何消息
        return;
    }
}
    
    const min = parseInt(S.minReplyTime) || 1,
        max = parseInt(S.maxReplyTime) || 5,
        cnt = parseInt(S.replyCount) || 1;
    const delay = Math.floor(Math.random() * (max * 60000 - min * 1000 + 1)) + min * 1000;
    
    if (cs.typing) {
        setTimeout(() => {
            const ti = document.createElement('div');
            ti.className = 'typing-indicator';
            ti.textContent = '秦彻正在输入...';
            document.getElementById('chatArea').appendChild(ti);
            scrollBottom();
        }, delay - 2000);
    }
    
    setTimeout(async () => {
        const ti = document.querySelector('.typing-indicator');
        if (ti) ti.remove();
        
        for (let i = 0; i < cnt; i++) {
            let c = await smartComposeReply();
            if (cs.quoteReply && Math.random() < ((cs.quoteReplyProb || 10) / 100)) {
                var allMsgs = await dbGetAll('messages');
                var myMsgs = allMsgs.filter(function(x) { return x.sender === 'me' && x.type === 'text'; });
                if (myMsgs.length > 0) {
                    var randomMsg = myMsgs[Math.floor(Math.random() * myMsgs.length)];
                    if (randomMsg && randomMsg.content) {
                        c = '「' + randomMsg.content + '」\n' + c;
                    }
                }
            }
            const m = { sender: 'other', content: c, type: 'text', timestamp: Date.now() };
            const id = await dbPut('messages', m);
            m.id = id;
            renderMsg(m);
            scrollBottom();
            
            // 秦彻随机收藏
            if (Math.random() < ((cs.qinCollectProb || 5) / 100)) {
                var collected = JSON.parse(localStorage.getItem('collectedMessages') || '[]');
                var allMsgs = await dbGetAll('messages');
                var myMsgs = allMsgs.filter(function(x) { return x.sender === 'me' && x.type === 'text'; });
                if (myMsgs.length > 0) {
                    var pick = myMsgs[Math.floor(Math.random() * myMsgs.length)];
                    collected.push({
                        id: Date.now(),
                        sender: 'me',
                        content: pick.content,
                        time: fmtTime(pick.timestamp),
                        timestamp: pick.timestamp,
                        collectedBy: 'qin'
                    });
                    localStorage.setItem('collectedMessages', JSON.stringify(collected));
                }
            }
            
            // 发表情
            if (cs.emojiMix && Math.random() < ((cs.emojiMixProb || 5) / 100)) {
                var emojiList = await dbGetAll('emojis');
                if (emojiList && emojiList.length > 0) {
                    var emoji = emojiList[Math.floor(Math.random() * emojiList.length)];
                    if (emoji && emoji.data) {
                        var emojiMsg = { sender: 'other', content: emoji.data, type: 'emoji', timestamp: Date.now() };
                        var emojiId = await dbPut('messages', emojiMsg);
                        emojiMsg.id = emojiId;
                        renderMsg(emojiMsg);
                        scrollBottom();
                    }
                }
            }
            
            // 拍一拍
            if (Math.random() < ((cs.patProb || 5) / 100) && patOptions.length > 0) {
                var pat = patOptions[Math.floor(Math.random() * patOptions.length)];
                var patMsg = { sender: 'other', content: pat, type: 'pat', timestamp: Date.now() };
                var patId = await dbPut('messages', patMsg);
                patMsg.id = patId;
                renderMsg(patMsg);
                scrollBottom();
                triggerPat(S.contactName, pat);
            }
            
            // 模拟来电
            if (cs.simCall && Math.random() < ((cs.simCallProb || 1) / 100) && callState === 'idle') {
                setTimeout(function() { startCallFromQinChe(); }, 2000);
            }
            
            if (i < cnt - 1) await new Promise(r => setTimeout(r, 800 + Math.random() * 3000));
        }
    }, delay);
}

async function getRandomReply(){
    const sg = JSON.parse(await getCal('chatGroups','[]'));
    const cards = await dbGetAll('wordcards');
    const dc = await dbGetAll('disabledCards');
    const dids = new Set(dc.map(d => String(d.cardId)));

// ============ 拼字卡回复 ============
async function smartComposeReply(){
    const sg = JSON.parse(await getCal('chatGroups','[]'));
    const ac = await dbGetAll('wordcards');
    const dc = await dbGetAll('disabledCards');
    const dids = new Set(dc.map(d => String(d.cardId)));
    const vc = ac.filter(c => {
        if(!c || !c.content || c.content === '__GROUP_PLACEHOLDER__' || c.content.length <= 1) return false;
        if(dids.has(String(c.id))) return false;
        if(sg.length > 0) return sg.includes(c.groupName) || sg.includes(c.groupId);
        return false;
    });
    if(vc.length === 0) return '😅 请先在模块设置里勾选聊天分组～';
    
    const cs = S.chatSettings;
    var cardMin = parseInt(cs.cardMin || 1);
    var cardMax = parseInt(cs.cardMax || 4);
    var count = Math.min(Math.floor(Math.random() * (cardMax - cardMin + 1)) + cardMin, vc.length);
    if (count < 1) count = 1;
    
    const shuffled = vc.sort(() => Math.random() - 0.5);
    var selected = shuffled.slice(0, count);
    
    // 随机删一张（概率可调）
    if (selected.length > 1 && Math.random() < ((cs.cardDeleteProb || 50) / 100)) {
        var del = Math.floor(Math.random() * selected.length);
        selected.splice(del, 1);
    }
    // 随机重复一张（概率可调）
    if (selected.length > 0 && Math.random() < ((cs.cardRepeatProb || 30) / 100)) {
        var dup = selected[Math.floor(Math.random() * selected.length)];
        selected.push(dup);
    }
    if (selected.length === 0) {
        selected.push(vc[Math.floor(Math.random() * vc.length)]);
    }
    return selected.map(c => c.content).join(' ');
}

    const all = await idbGetAll('calendarSettings');
    const matches = all.filter(x => x.key === 'emojiGroups');
    matches.sort((a, b) => b.timestamp - a.timestamp);
    let g = matches.length > 0 ? JSON.parse(matches[0].value) : ['全部'];
    const emojis = await dbGetAll('emojis');
    emojis.forEach(e => { if (e.group && !g.includes(e.group)) g.push(e.group); });
    if (g.length === 0) g = ['全部'];
    // 保存
    const existing = all.find(x => x.key === 'emojiGroups');
    if (existing) {
        existing.value = JSON.stringify(g);
        existing.timestamp = Date.now();
        await idbPut('calendarSettings', existing);
    } else {
        await idbPut('calendarSettings', { key: 'emojiGroups', value: JSON.stringify(g), timestamp: Date.now() });

    return g;
}

// ============ IndexedDB 存储层（补丁） ============
window.db = null;

window.openDB = function() {
    return new Promise(function(resolve, reject) {
        var req = indexedDB.open('TimeTreeDB', 5);
        req.onupgradeneeded = function(e) {
            var d = e.target.result;
           var stores = ['messages', 'settings', 'wordcards', 'emojis', 'avatars',
    'callLogs', 'patOptions', 'statusOptions', 'disabledCards',
    'disabledGroups', 'avatarHistory', 'bgSettings', 'boardMessages',
    'wishes', 'anniversaries', 'answerBookHistory', 'choiceHistory',
    'tarotMessages', 'calendarSettings', 'tarotSettings', 'tarotHistory',
    'mailLetters'];
            stores.forEach(function(s) {
                if (!d.objectStoreNames.contains(s)) {
                    if (s === 'settings' || s === 'bgSettings' || s === 'tarotSettings') {
                        d.createObjectStore(s, { keyPath: 'key' });
                    } else {
                        d.createObjectStore(s, { keyPath: 'id', autoIncrement: true });
                    }
                }
            });
        };
        req.onsuccess = function(e) { 
            window.db = e.target.result; 
            console.log('✅ 数据库已打开');
            resolve(window.db); 
        };
        req.onerror = function(e) { 
            console.error('❌ 数据库打开失败:', e.target.error);
            reject(e.target.error); 
        };
    });
};

window.idbGetAll = async function(store) {
    if (!window.db) await window.openDB();
    return new Promise(function(resolve, reject) {
        try {
            var tx = window.db.transaction(store, 'readonly');
            var req = tx.objectStore(store).getAll();
            req.onsuccess = function() { resolve(req.result || []); };
            req.onerror = function(e) { reject(e.target.error); };
        } catch(e) {
            reject(e);
        }
    });
};

window.idbPut = async function(store, data) {
    if (!window.db) await window.openDB();
    return new Promise(function(resolve, reject) {
        try {
            if (!data.id && !data.key) data.id = Date.now() + Math.random() * 1000;
            var tx = window.db.transaction(store, 'readwrite');
            var st = tx.objectStore(store);
            var req = st.put(data);
            req.onsuccess = function() { resolve(data.id || req.result); };
            req.onerror = function(e) { reject(e.target.error); };
        } catch(e) {
            reject(e);
        }
    });
};

window.idbDelete = async function(store, id) {
    if (!window.db) await window.openDB();
    return new Promise(function(resolve, reject) {
        try {
            var tx = window.db.transaction(store, 'readwrite');
            var req = tx.objectStore(store).delete(id);
            req.onsuccess = function() { resolve(); };
            req.onerror = function(e) { reject(e.target.error); };
        } catch(e) {
            reject(e);
        }
    });
};

window.idbClear = async function(store) {
    if (!window.db) await window.openDB();
    return new Promise(function(resolve, reject) {
        try {
            var tx = window.db.transaction(store, 'readwrite');
            var req = tx.objectStore(store).clear();
            req.onsuccess = function() { resolve(); };
            req.onerror = function(e) { reject(e.target.error); };
        } catch(e) {
            reject(e);
        }
    });
};

async function autoReplyToUser(userMsg) {
    var groupName = await getCal('mailboxGroups', '[]');
    var groups = JSON.parse(groupName);
    if (!groups || groups.length === 0) return;
    
    var allCards = await dbGetAll('wordcards');
    var cards = allCards.filter(function(c) {
        return groups.some(function(g) { return c.groupName === g || c.groupId === g; }) &&
            c.content && c.content !== '__GROUP_PLACEHOLDER__' && c.content.length > 1;
    });
    if (cards.length === 0) return;
    
    // 拼字卡 1~4 条
    var count = Math.min(Math.floor(Math.random() * 4) + 1, cards.length);
    var shuffled = cards.slice().sort(function() { return Math.random() - 0.5; });
    var selected = shuffled.slice(0, count);
    
    // 随机删一张
    if (selected.length > 1 && Math.random() < Math.random()) {
        selected.splice(Math.floor(Math.random() * selected.length), 1);
    }
    // 随机重复一张
    if (selected.length > 0 && Math.random() < Math.random()) {
        selected.push(selected[Math.floor(Math.random() * selected.length)]);
    }
    
    var replyContent = selected.map(function(c) { return c.content; }).join(' ');
    
    // 标记用户留言已回复
    userMsg.replied = true;
    await dbPut('boardMessages', userMsg);
    
    // 存入秦彻的回复
    await dbPut('boardMessages', {
        sender: 'qin',
        content: replyContent,
        time: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),

                '<div style="font-size:11px;color:#ccc;">' + item.date + '</div>' +
                '</div>' +
                '<span style="color:#d4a8b8;font-size:12px;">' + (days >= 0 ? '已过 ' + days + ' 天' : '还有 ' + Math.abs(days) + ' 天') + '</span>' +
                '<span onclick="deleteAnniversary(' + i + ')" style="cursor:pointer;color:#d4a8b8;font-size:14px;padding:0 4px;">✕</span>' +
                '</div>';
        });
    }
    
    h += '</div>' +

        '<div style="display:flex;justify-content:space-between;margin-bottom:14px;">' +

            return '<div style="font-size:11px;color:#bbb;padding:4px 0;">' + d + '</div>';
        }).join('');
    
    const firstDay = new Date(cy, cm, 1).getDay();
    const daysInMonth = new Date(cy, cm + 1, 0).getDate();
    const startOffset = firstDay === 0 ? 6 : firstDay - 1;
    
    for (let i = 0; i < startOffset; i++) {
        h += '<div style="padding:4px 0;"></div>';

// ===== 加速回信 =====
async function accelerateReply() {
    var pending = JSON.parse(await getCal('pendingReplies', '[]'));
    
    if (pending.length > 0) {
        if (mailState.accelerated) { showToast('冷却中，明天再来'); return; }
        if (Date.now() < mailState.cooldownUntil) { showToast('冷却中'); return; }
        
        pending.forEach(function(p) {
            p.replyAt = Date.now() + randHours(2, 4);
            p.accelerated = true;
        });
        await setCal('pendingReplies', JSON.stringify(pending));
        
        mailState.accelerated = true;
        mailState.cooldownUntil = Date.now() + 24 * 3600 * 1000;
        mailState.status = 'waiting';
        mailState.replyAt = pending[pending.length - 1].replyAt;
        await setCal('mailState', JSON.stringify(mailState));
        
        renderMailboxMain();
        showToast(' 他提笔回信了');
        return;
    }
    
    // 没信在路上：触发主动来信
    var lastTrigger = parseInt(await getCal('lastActiveMailDate', '0'));
    var today = new Date().toDateString();
    if (new Date(parseInt(lastTrigger)).toDateString() === today) {
        showToast('今天已经期待过了，明天再来');
        return;
    }
    
    var now = new Date();
    var hour = now.getHours();
    if (hour < 9 || hour > 21) {
        showToast('现在太晚了，他睡了');
        return;
    }
    
    // 隔天 9-21 点随机触发
    var triggerTime = new Date(now);
    triggerTime.setDate(triggerTime.getDate() + 1);
    triggerTime.setHours(9 + Math.floor(Math.random() * 12), Math.floor(Math.random() * 60), 0, 0);
    
    await setCal('lastActiveMailDate', String(Date.now()));
    
    showToast(' 他会在明天想起你');
}

function randHours(min, max) {
    return (min + Math.random() * (max - min)) * 3600 * 1000; // 正式：小时级
}

// ===== 检查回信 =====
async function checkMailReply() {
    var pending = JSON.parse(await getCal('pendingReplies', '[]'));
    if (pending.length === 0) return;
    
    var groupStr = await getCal('mailGroups', '[]');
    var groups = JSON.parse(groupStr);
    if (!groups || groups.length === 0) return;
    
    var cards = await dbGetAll('wordcards');
    var pool = cards.filter(function(c) {
        return groups.some(function(g) { return c.groupName === g || c.groupId === g; }) &&
            c.content && c.content !== '__GROUP_PLACEHOLDER__' && c.content.length > 1;
    });
    if (pool.length === 0) return;
    
    var newPending = [];
    var hasNew = false;
    
    for (var i = 0; i < pending.length; i++) {
        var p = pending[i];
        if (Date.now() >= p.replyAt) {
            var count = Math.min(Math.floor(Math.random() * 29) + 2, pool.length);
            var shuffled = pool.sort(function() { return Math.random() - 0.5; });
            var selected = shuffled.slice(0, count);
            var body = selected.map(function(c) { return c.content; }).join('\n');
            
            var now = new Date();
            var dateStr = now.getFullYear() + '.' + (now.getMonth()+1) + '.' + now.getDate();
            
            await dbPut('mailLetters', {
                direction: 'received',
                content: body,
                dateStr: dateStr,
                timestamp: Date.now(),
                read: false
            });
            hasNew = true;
        } else {
            newPending.push(p);
        }
    }
    
    await setCal('pendingReplies', JSON.stringify(newPending));
    
    if (newPending.length === 0) {
        mailState.status = 'idle';
        mailState.accelerated = false;
        await setCal('mailState', JSON.stringify(mailState));
    } else {
        mailState.status = 'waiting';
        mailState.replyAt = newPending[newPending.length - 1].replyAt;
        await setCal('mailState', JSON.stringify(mailState));
    }
    
    if (hasNew) {
        updateMailboxUnread();
        showToast(' 有一封新来信');
    }
}

    for (var i = 0; i < count; i++) {
        var card;
        do {
            card = TAROT_CARDS[Math.floor(Math.random() * TAROT_CARDS.length)];
        } while (used.has(card.id) && used.size < TAROT_CARDS.length);
        used.add(card.id);
        cards.push({ card: card, isReversed: Math.random() < 0.3 });
    }
    tarotState.cards = cards;
    renderTarotResult();
}

// 递给他看 → 回应页
async function submitTarotToRole() {
    var pool = TAROT_RESPONSE_POOL.qinche.concat(TAROT_RESPONSE_POOL.shared);
    tarotState.response = pool[Math.floor(Math.random() * pool.length)];
    
    var ctxLabels = {love:'感情人际', career:'现实发展', self:'内心日常'};
    var ctx = ctxLabels[tarotState.context] || '感情人际';
    
    var cardsText = tarotState.cards.map(function(item, idx) {
        var card = item.card;
        var isRev = item.isReversed;
        var data = isRev ? card.reversed : card.upright;
        var position = tarotState.spreadCount === 3 ? ['过去','现在','未来'][idx] : '';
        return (position ? position + '：' : '') + card.name + ' · ' + (isRev ? '逆位' : '正位') + '｜' + data.summary + '｜【' + ctx + '】' + (data[tarotState.context] || data.summary);
    }).join('\n');
    
    document.getElementById('tarotContent').innerHTML =
    '<div style="padding:16px;display:flex;flex-direction:column;align-items:center;background:#f8f5f0;min-height:100vh;">' +
    '<div style="width:100%;max-width:400px;">' +
    '<div style="background:#fff;border:1px solid #f0ece8;border-radius:16px;padding:16px;margin-bottom:16px;">' +
    '<div style="font-size:11px;color:#999;margin-bottom:8px;">' + new Date().toLocaleDateString('zh-CN') + ' ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + '</div>' +
    (tarotState.question ? '<div style="font-size:13px;color:#333;margin-bottom:8px;">问题：' + tarotState.question + '</div>' : '') +
    '<div style="font-size:13px;color:#555;white-space:pre-wrap;line-height:1.8;">' + cardsText + '</div>' +
    '</div>' +
    '<div style="text-align:center;padding:16px;">' +
    '<div style="font-size:15px;color:#d4a8b8;line-height:2;font-style:italic;">秦彻：“' + tarotState.response + '”</div>' +
    '</div>' +
    '<div style="display:flex;gap:10px;justify-content:center;margin-top:16px;">' +
    '<button onclick="saveTarotQuote()" style="padding:10px 24px;border-radius:20px;font-size:13px;background:#d4a8b8;color:#fff;border:none;cursor:pointer;">存为语录</button>' +
    '<button onclick="renderTarotMain()" style="padding:10px 24px;border-radius:20px;font-size:13px;border:1px solid #f0ece8;color:#999;background:#fff;cursor:pointer;">不存，再次占卜</button>' +
    '</div></div></div>';
}

// 获取牌面 SVG
function getTarotCardSvg(card) {
    if (card.suit === 'major') {
        var idx = TAROT_MAJOR_NAMES.indexOf(card.name);
        if (idx >= 0 && TAROT_MAJOR_DRAWERS[idx]) {
            return '<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">' + TAROT_MAJOR_DRAWERS[idx]() + '</svg>';
        }
    }
    var rankMap = {ACE:'ACE',II:'II',III:'III',IV:'IV',V:'V',VI:'VI',VII:'VII',VIII:'VIII',IX:'IX',X:'X',PAGE:'P',KNIGHT:'KN',QUEEN:'Q',KING:'KG'};
    var r = rankMap[card.rank] || card.rank;
    if (card.suit === 'swords') return '<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">' + tarotSvgSword(r) + '</svg>';
    if (card.suit === 'wands') return '<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">' + tarotSvgWand(r) + '</svg>';
    if (card.suit === 'pentacles') return '<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">' + tarotSvgPent(r) + '</svg>';
    if (card.suit === 'cups') {
        var cupMap = {ACE:'圣杯一',II:'圣杯二',III:'圣杯三',IV:'圣杯四',V:'圣杯五',VI:'圣杯六',VII:'圣杯七',VIII:'圣杯八',IX:'圣杯九',X:'圣杯十',PAGE:'圣杯侍从',KNIGHT:'圣杯骑士',QUEEN:'圣杯王后',KING:'圣杯国王'};
        return tarotSvgCup(cupMap[card.rank] || card.name);
    }
    return '';
}

async function exportChatByDate() {
    var start = document.getElementById('exportStartDate').value;
    var end = document.getElementById('exportEndDate').value;
    if (!start || !end) { showToast('请选择日期范围'); return; }

    var startTs = new Date(start + 'T00:00:00').getTime();
    var endTs = new Date(end + 'T23:59:59').getTime();

    var msgs = await dbGetAll('messages');
    var filtered = msgs.filter(function(m) {
        return m.timestamp >= startTs && m.timestamp <= endTs;
    });
    filtered.sort(function(a,b) { return a.timestamp - b.timestamp; });

    if (filtered.length === 0) { showToast('该时间段没有消息'); return; }

    var text = '秦彻和笑笑的时光树洞\n' + '导出时间: ' + start + ' 至 ' + end + '\n' + '='.repeat(30) + '\n\n';
    filtered.forEach(function(m) {
        var sender = m.sender === 'me' ? S.myName : S.contactName;
        var content = m.type === 'text' ? m.content : (m.type === 'emoji' ? '[表情]' : (m.type === 'pat' ? '[拍一拍]' : '[图片]'));
        text += '[' + fmtTime(m.timestamp) + '] ' + sender + ': ' + content + '\n';
    });

    // 复制到剪贴板
    navigator.clipboard.writeText(text).then(function() {
        showToast('✅ 已复制到剪贴板');
    }).catch(function() {
        // 降级：下载文件
        downloadBlob(text, '聊天记录_' + start + '_' + end + '.txt');
    });

    localStorage.setItem('lastBackupTime', Date.now());
}

        // 7. 通话浮球拖动事件
        const ball = document.getElementById('callFloatBall');
        let ballDragging = false, ballStartX = 0, ballStartY = 0, ballLeft = 0, ballTop = 0, ballMoved = false;

        if (ball) {
            ball.addEventListener('touchstart', function(e) {
                if (callState !== 'active') return;
                ballDragging = true;
                ballMoved = false;
                const t = e.touches[0];
                ballStartX = t.clientX;
                ballStartY = t.clientY;
                const r = ball.getBoundingClientRect();
                ballLeft = r.left;
                ballTop = r.top;
                ball.style.right = 'auto';
                ball.style.bottom = 'auto';
                ball.style.left = ballLeft + 'px';
                ball.style.top = ballTop + 'px';
                e.preventDefault();
            }, { passive: false });

            ball.addEventListener('touchmove', function(e) {
                if (!ballDragging) return;
                ballMoved = true;
                const t = e.touches[0];
                let l = ballLeft + (t.clientX - ballStartX);
                let tp = ballTop + (t.clientY - ballStartY);
                l = Math.max(4, Math.min(window.innerWidth - 58, l));
                tp = Math.max(60, Math.min(window.innerHeight - 160, tp));
                ball.style.left = l + 'px';
                ball.style.top = tp + 'px';
                e.preventDefault();
            }, { passive: false });

            ball.addEventListener('touchend', function() {
                if (!ballDragging) return;
                ballDragging = false;
                if (!ballMoved && callState === 'active') {
                    restoreCall();
                }
            });

            // 鼠标拖动支持（PC端）
            ball.addEventListener('mousedown', function(e) {
                if (callState !== 'active') return;
                ballDragging = true;
                ballMoved = false;
                ballStartX = e.clientX;
                ballStartY = e.clientY;
                const r = ball.getBoundingClientRect();
                ballLeft = r.left;
                ballTop = r.top;
                ball.style.right = 'auto';
                ball.style.bottom = 'auto';
                ball.style.left = ballLeft + 'px';
                ball.style.top = ballTop + 'px';
                e.preventDefault();
            });

            document.addEventListener('mousemove', function(e) {
                if (!ballDragging) return;
                ballMoved = true;
                let l = ballLeft + (e.clientX - ballStartX);
                let tp = ballTop + (e.clientY - ballStartY);
                l = Math.max(4, Math.min(window.innerWidth - 58, l));
                tp = Math.max(60, Math.min(window.innerHeight - 160, tp));
                ball.style.left = l + 'px';
                ball.style.top = tp + 'px';
            });

            document.addEventListener('mouseup', function() {
                if (!ballDragging) return;
                ballDragging = false;
                if (!ballMoved && callState === 'active') {
                    restoreCall();
                }
            });
        }
